function refKey(ref){if(INV&&INV.mode==='base'){const s=M.stash.find(x=>'s'+x.id===ref);if(s)return s.k;return RELICS[ref]?ref:null;}return ref;}
function invConts(){return INV.mode==='base'?{safe:M.lo.safe,bag:M.lo.bag}:{safe:R.safe,bag:R.bag};}
function placedWhere(ref){const cs=invConts();for(const n of ['safe','bag']){const i=cs[n].items.findIndex(it=>it.ref===ref);if(i>=0)return [n,i];}return null;}
function invPool(){
  if(INV.mode==='base')return M.stash.map(s=>'s'+s.id).filter(r=>!placedWhere(r));
  return R.relics.map(r=>r.k).filter(k=>!placedWhere(k));
}
function canPlace(cont,k,x,y,rot){
  const [w,h]=relSize(k,rot);
  if(x<0||y<0||x+w>cont.w||y+h>cont.h)return false;
  if(cont.mask)for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++)if(!cellOn(cont,x+dx,y+dy))return false;
  for(const it of cont.items){const [w2,h2]=relSize(refKey(it.ref),it.rot);if(x<it.x+w2&&it.x<x+w&&y<it.y+h2&&it.y<y+h)return false;}
  return true;
}
function contValue(cont){return cont.items.reduce((s,it)=>s+relVal(refKey(it.ref)),0);}
function contUsed(cont){return cont.items.reduce((s,it)=>{const k=refKey(it.ref);if(!k||!RELICS[k])return s;const [w,h]=relSize(k);return s+w*h;},0);}
function invSelect(ref){if(INV.sel&&INV.sel.ref===ref)INV.sel=null;else INV.sel={ref,rot:0};invRefresh();}
function invPick(cn,i){const cont=invConts()[cn];const it=cont.items[i];if(!it)return;cont.items.splice(i,1);INV.sel={ref:it.ref,rot:it.rot||0};hideTip();invRefresh();}
function invRotate(){if(!INV||!INV.sel)return;const [w,h]=relSize(refKey(INV.sel.ref));if(w===h)return;INV.sel.rot=INV.sel.rot?0:1;invRefresh();if(INV.last)invHover(...INV.last);}
function invCell(cn,x,y){
  if(!INV.sel)return;
  const cont=invConts()[cn];const k=refKey(INV.sel.ref);
  if(INV.mode==='base'){const cs=invConts();const dup=[...cs.safe.items,...cs.bag.items].some(it=>refKey(it.ref)===k);if(dup){toast('同名遗物只能带一件');return;}}
  if(!canPlace(cont,k,x,y,INV.sel.rot)){toast('放不下');return;}
  cont.items.push({ref:INV.sel.ref,x,y,rot:INV.sel.rot});INV.sel=null;
  if(INV.mode!=='base'&&!C)save();if(INV.mode==='base')save();
  invRefresh();
}
function invHover(cn,x,y){
  document.querySelectorAll('.cell.ok,.cell.bad').forEach(c=>c.classList.remove('ok','bad'));
  if(!cn||!INV||!INV.sel)return;
  INV.last=[cn,x,y];
  const cont=invConts()[cn];const k=refKey(INV.sel.ref);const [w,h]=relSize(k,INV.sel.rot);
  const ok=canPlace(cont,k,x,y,INV.sel.rot);
  for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++){const el=document.getElementById(`cell-${cn}-${x+dx}-${y+dy}`);if(el)el.classList.add(ok?'ok':'bad');}
}
function invRefresh(){if(!INV)return;if(INV.target==='modal')openModal(invModalHTML());else render();}
function gridHTML(cn,label,cont,note){
  let cells='';
  for(let y=0;y<cont.h;y++)for(let x=0;x<cont.w;x++)if(cellOn(cont,x,y))cells+=`<div class="cell" id="cell-${cn}-${x}-${y}" style="left:${x*CS}px;top:${y*CS}px" onmouseenter="invHover('${cn}',${x},${y})" onclick="invCell('${cn}',${x},${y})" oncontextmenu="event.preventDefault();invRotate()"></div>`;
  const items=cont.items.map((it,i)=>{const k=refKey(it.ref);const d=RELICS[k];const [w,h]=relSize(k,it.rot);const big=w*h>=4;return `<div class="gitem g-${d.r} bq-${d.r}${d.big?" bigred":""}" style="left:${it.x*CS+2}px;top:${it.y*CS+2}px;width:${w*CS-4}px;height:${h*CS-4}px" onclick="invPick('${cn}',${i})" data-tip="${esc(relicTip(k,'<div class=sub>点击拿起</div>'))}"><span style="font-size:${big?34:22}px">${d.e}</span>${big||w>1?`<small>${d.n}</small>`:''}</div>`;}).join('');
  return `<div class="contbox ${cn}"><div class="row" style="gap:6px"><b>${label}</b><span class="muted" style="font-size:12px">${cont.bag?BAGS[cont.bag].n+' · ':cont.w+'×'+cont.h+' · '}已用 ${contUsed(cont)}/${contCap(cont)} · 💎${contValue(cont)}</span></div><div class="grid ${INV.sel?'holding':''} ${cont.mask?'masked':''}" style="width:${cont.w*CS}px;height:${cont.h*CS}px" onmouseleave="invHover(null)">${cells}${items}</div><div class="muted" style="font-size:12px;margin-top:6px;max-width:${Math.max(cont.w*CS,180)}px">${note}</div></div>`;
}
function poolItemHTML(ref,extra=''){
  const k=refKey(ref);const d=RELICS[k];const [w,h]=relSize(k);const sel=INV.sel&&INV.sel.ref===ref;
  return `<div class="pitem bq-${d.r}${d.big?" bigred":""} ${sel?'sel':''}" onclick="invSelect('${ref}')" data-tip="${esc(relicTip(k,'<div class=sub>点击拿起，再点格子放下</div>'))}"><span class="pe">${d.e}</span><div><div class="pn q-${d.r}">${d.n}</div><div class="ps">${w}×${h} · 💎${relVal(k)}</div></div>${extra}</div>`;
}
function invBodyHTML(poolTitle,poolNote,poolExtra){
  const cs=invConts();const pool=invPool();
  const hold=INV.sel&&!(typeof DRAG!=='undefined'&&DRAG)?`<div class="holdbar">✋ 正拿着 <b>${RELICS[refKey(INV.sel.ref)].n}</b>（${relSize(refKey(INV.sel.ref),INV.sel.rot).join('×')}）—— 点格子放下 · <b>${typeof MOB!=='undefined'&&MOB?'右下角 ⟲ 按钮':'R 键 / 右键'}</b>旋转（也可以直接按住拖动） · <a href="#" onclick="event.preventDefault();INV.sel=null;invRefresh()" style="color:#f2c14e">放回</a></div>`:'';
  return `${hold}<div class="inv">${gridHTML('safe','🔒 安全箱',cs.safe,'阵亡也不会丢失')}${gridHTML('bag','🎒 背包',cs.bag,'成功撤离时带走')}
  <div class="grow" style="min-width:260px"><b>${poolTitle}</b> <span class="muted" style="font-size:12px">${poolNote}</span><div class="pool" style="margin-top:6px">${pool.length?pool.map(r=>poolItemHTML(r,poolExtra?poolExtra(r):'')).join(''):'<span class="muted">（空）</span>'}</div></div></div>`;
}

function extractCr(){const n=curNode();const g=GRADES[n.grade]||GRADES.normal;return Math.floor(R.gold*0.5)+Math.round(30*(R.layer||1)*g.cr);}
function toExtract(how){R.phase='extract';R.exitHow=how;INV={mode:'run',sel:null,target:'app'};UI={screen:'extract'};save();render();}
function doExtract(){
  const items=[...R.safe.items,...R.bag.items].map(it=>it.ref);
  const how=R.exitHow;const layer=R.layer;
  const cr=extractCr();
  const got=items.map(k=>({id:M.sid++,k}));
  M.stash.push(...got);
  M.crystals+=cr;M.stats.extracts++;chStat(R.ch||'knight').extracts++;
  const left=R.relics.map(r=>r.k).filter(k=>!items.includes(k));
  const value=items.reduce((s,k)=>s+relVal(k),0);
  const sc=runScore(true,value);M.crystals+=sc.bonus;
  achOnExtract(items,value,sc);
  if(typeof coonUnlockCheck==='function')coonUnlockCheck();
  const summary={got:items,left,cr,how,layer,value,score:sc};
  R=null;C=null;INV=null;M.lo=null;save();
  UI={screen:'result',ok:true,summary};render();
}
function defeat(){RNGF=null;
  if(inPractice()){endPractice(false);return;}
  const kept=R.safe.items.map(it=>it.ref);
  const lost=R.relics.map(r=>r.k).filter(k=>!kept.includes(k));
  const cr=(R.cleared||0)*2;
  M.stash.push(...kept.map(k=>({id:M.sid++,k})));
  M.crystals+=cr;M.stats.deaths++;chStat(R.ch||'knight').deaths++;
  const sc=runScore(false,0);M.crystals+=sc.bonus;
  if(M.stats.deaths>=10)achGet('stubborn');
  const summary={kept,lost,cr,layer:R.layer||1,score:sc};
  R=null;C=null;INV=null;M.lo=null;save();closeModal();
  UI={screen:'result',ok:false,summary};render();
}
function abandonRun(){openModal(`<h2>放弃远征？</h2><p>放弃等同于阵亡：除了安全箱里的遗物，其他全部丢失。</p><div class="row"><button class="danger" onclick="closeModal();C=null;R.hp=0;defeat()">确认放弃</button><button onclick="closeModal()">取消</button></div>`);}

function goBase(){RNGF=null;INV={mode:'base',sel:null,target:'app'};if(!R)ensureLo();UI={screen:'base'};render();}
function startRun(){RNGF=null;
  ensureLo();
  const lo=M.lo;const ch=charUnlocked(M.ch)?M.ch:'knight';const CH=CHARS[ch];
  R={ch,hp:0,max:CH.hp+(M.up.hp||0)*6,gold:99+(M.up.gold||0)*40,deck:[],relics:[],act:1,rs:{},removeCost:75,cleared:0,phase:'map',layer:1,theme:'forest',
     safe:mkCont(safeSize()),bag:mkBag(M.bag),map:genLayer(1,'forest'),pos:0,visited:[0]};
  R.hp=R.max;
  CH.deck.forEach(([k,n])=>{for(let i=0;i<n;i++)R.deck.push(mkCard(k));});
  addRelic(CH.relic);
  for(const cn of ['safe','bag']){
    for(const it of lo[cn].items){
      const s=M.stash.find(x=>'s'+x.id===it.ref);if(!s||has(s.k))continue;
      addRelic(s.k);
      R[cn].items.push({ref:s.k,x:it.x,y:it.y,rot:it.rot||0});
      M.stash=M.stash.filter(x=>x!==s);
    }
  }
  R.st=newRunStats();R.st.bare=R.relics.length<=1;
  M.lo=null;M.stats.runs++;chStat(ch).runs++;
  INV=null;MV=null;
  if(M.uni&&M.uni.unlocked&&M.uni.lv>0){R.uni={offers:genUniOffer(),bought:0,refresh:0};R.phase='unishop';UI={screen:'unishop'};save();render();}else toMap();
}
function sellItem(ref){
  const s=M.stash.find(x=>'s'+x.id===ref);if(!s)return;
  const v=Math.round(relVal(s.k)*0.8);
  M.stash=M.stash.filter(x=>x!==s);M.crystals+=v;ensureLo();toast('出售获得 💎'+v);save();render();
}
function buyUpg(k){const u=UPG[k];const l=M.up[k]||0;if(l>=u.max)return;const c=u.cost(l);if(M.crystals<c)return;M.crystals-=c;M.up[k]=l+1;ensureLo();save();render();}

function mdTable(md){
  const ls=md.trim().split('\n').filter(l=>l.trim().startsWith('|'));
  const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim());
  const hd=cells(ls[0]);const body=ls.slice(2).map(cells);
  return `<div class="ntw"><table class="ntab"><thead><tr>${hd.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${c.replace(/(\d+%?(?:\/\d+)?)\s*→\s*(\d+%?(?:\/\d+)?)/g,'<span class="nb">$1</span> → <b>$2</b>')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

  <div class="ncax"><span>0%</span><span>50%</span><span>100%</span></div></div>`;
}
function deckLine(d){
  const m=new Map();
  for(const [k,u] of d){const key=k+(u?'+':'');m.set(key,(m.get(key)||0)+1);}
  return [...m].map(([key,n])=>{const k=key.replace('+','');const c=CARDS[k];return c?`<span class="ndk rr-${c.r}" data-tip="${esc(cardTip({k,u:key.endsWith('+')})||'')}">${c.n}${key.endsWith('+')?'+':''}${n>1?'×'+n:''}</span>`:'';}).join('');
}

{v:'2.2',date:'2026-11-12',tag:'新功能',title:'存档导出 / 导入 · 手机横屏布局 · 点一下看牌、再点一下打出',lead:'游戏现在可以单独存成一个文件，在电脑上双击就能玩；存档可以用一串存档码搬来搬去。用手机浏览器打开时会自动切换成横屏一屏的手机布局。电脑上的样子和操作不变。',
 body:()=>`<h3>💾 导出 / 导入存档</h3><ul>
<li>设置里新增「导出 / 导入存档」。导出得到一串存档码（会自动复制），在另一个地方点导入、粘贴进去，进度就搬过去了。</li>
<li>适合把这里的进度搬到电脑上的游戏文件里，反过来也行。导入会覆盖那边原来的进度。</li></ul>
<h3>📱 手机横屏布局</h3><ul>
<li>手机横屏时，整个战斗画面刚好一屏，不用上下滑动。</li>
<li>手牌在屏幕下方露出上半张。<b>点一下</b>：卡牌抬起来、完整显示说明；<b>再点一下</b>：打出。点空白处取消。需要选目标的牌：点一下抬起，再点要打的敌人。</li>
<li>能量和抽牌堆在左下角，结束回合、弃牌堆、消耗在右下角，重开在左上角。</li>
<li><b>长按</b>卡牌、遗物、状态、意图等会弹出说明；出发准备里拿起遗物后，右下角有「⟲ 旋转」和「✕ 放下」按钮。</li>
<li>主菜单、事件页也改成了适合横屏的排版；竖屏时会提示把手机横过来。</li></ul>`},
{v:'2.1.2',date:'2026-11-11',tag:'修复',title:'出售区可以「点一下再点一下」卖东西了',lead:'出发准备里拿起遗物有两种方式：按住拖动，或者先点一下拿起、再点目标位置放下。以前出售区只认「按住拖过去松手」：如果是点一下拿起遗物，再去点出售区，出售区虽然会亮，但什么都不会发生，遗物又回到仓库。现在两种方式都能卖了。',body:()=>''},
{v:'2.1.1',date:'2026-11-11',tag:'修复',title:'修复小雨打出「致命」后能量暴涨',lead:'小雨的能力牌「致命」和影刃刺客的「致命连段」内部用了同一个名字，结果打出「致命」后会被当成「致命连段 50」：每打 5 张牌就白送 50 点能量（带着冰淇淋还会一直攒下去），状态栏里也会冒出一个莫名其妙的连段图标。现在两者分开了，「致命」只会让每回合第一张攻击牌伤害 +50%（升级后 +75%）。',body:()=>''},
{v:'2.1',date:'2026-11-11',tag:'调整',title:'契约师改名「小雨」· 模型缩小 · 特效加强 · 公主的星空琉璃壁',lead:'第五位角色改名叫「小雨」。模型缩小到和其他角色差不多大，攻击、灵魂、精神过载的特效都更明显了，星光公主的防御换成了绕着身边转的星空琉璃壁。',
 body:()=>`<h3>✏️ 改名和规则</h3><ul>
<li>角色名从「亡灵契约师」改成「小雨」，图鉴分页是「☂️ 小雨卡牌」。</li>
<li>「预借时间」换成原版现在的版本：1 费，获得 4 点能量（升级后 6 点），本回合所有牌耗能 +1。</li>
<li>「禁忌魔典」的永恒现在真的生效了：商店、篝火和事件里都不能移除它，也不会被变化。</li></ul>
<h3>📏 模型大小</h3><ul>
<li>小雨、雨伞和小猫整体缩小，人物的高度现在和骑士、猪煲差不多。</li>
<li>星光公主缩得更多一些，公主和骑士加起来和其他角色一样大。</li>
<li>公主改用你给的设定图重新描：正面站立的公主，加上一根完整的星星法杖。举法杖的时候整根一起抬起来，不会再从中间断开。</li></ul>
<h3>✨ 特效</h3><ul>
<li>普通攻击的雨云更大，位置也更高，雨点更多；大伤害攻击的乌云和闪电也一起放大了。</li>
<li>公主的流星更大，带着更长的尾巴，落地时有一圈光环。</li>
<li>灵魂牌的动画放慢：先有一圈小幽灵在身边浮出来，再慢慢飞向牌堆，幽灵也更大更亮。</li>
<li>防御时伞变大的上限调小了，不会再撑出画面。</li></ul>
<h3>🧠 精神过载</h3><ul>
<li>打出后小雨会把伞转两圈，天上劈下两道紫色闪电，然后她的眼睛变成发光的紫色，全身带上紫色光晕，身边一直冒电火花，直到战斗结束。</li>
<li>星光公主会举起法杖放光，眼睛变成金色。</li></ul>
<h3>💠 星光公主的防御</h3><ul>
<li>原来的半透明星空罩子换成了「星空琉璃壁」：一圈六边形的琉璃片绕着公主和骑士慢慢转，转到前面的会挡在人物前，转到后面的会绕到身后。琉璃片里有星星，表面有一道反光扫过。</li>
<li>格挡越多，琉璃片越多（最多 8 片）、越大；打出防御牌时，琉璃片会一起闪一下。</li></ul>`},
{v:'2.0',date:'2026-11-11',tag:'新角色',title:'第五位角色：亡灵契约师 · 撑伞的小女孩和她的小猫',lead:'照着《杀戮尖塔2》的亡灵契约师做的新角色，88 张牌的效果都和原版一样。原版里的骷髅大手「奥斯提」换成了一只小猫：它会替你挨打、替你咬人，召唤越多长得越大。小猫不会被打死，没血了就躲到雨伞后面，召唤一下就会重新跑出来。用任意角色击败第 3 层 Boss 后解锁。',
 body:()=>`<h3>☂️ 亡灵契约师</h3><ul>
<li>生命 70，初始遗物 ⚱️ 束缚命匣：战斗开始时召唤 3，之后每回合开始召唤 1。</li>
<li>初始牌组：打击 ×4、防御 ×4、保镖、释放。</li>
<li><b>解锁</b>：用任意角色击败第 3 层 Boss。</li></ul>
<h3>🐱 小猫（原版的奥斯提）</h3><ul>
<li>敌人攻击你时，先扣格挡；没被挡住的伤害由小猫先接，接不住的部分才打到你身上。</li>
<li><b>召唤 X</b>：小猫的生命上限和当前生命都 +X。小猫的体型会跟着生命上限一起变大。</li>
<li>小猫没血了不会被打死，而是躲到雨伞后面。躲起来的时候不会替你挨打，「小猫造成伤害」的牌也打不出效果。再召唤一次，它就会以这么多生命重新跑出来。</li>
<li>小猫头上的小牌子显示它当前的生命。</li>
<li>小猫攻击时会跑到敌人面前：「戳」「猛晃」是挠，「猛咬」「紧追不放」是咬，「释放」「拍扁」「守护者」是扑上去。小猫的攻击不吃你的力量和虚弱，但吃敌人的易伤，还有「钙化」加成。</li></ul>
<h3>🌩️ 灾厄</h3><ul>
<li>敌人头上会出现一朵乌云，上面的数字就是灾厄层数。</li>
<li>它自己的回合结束时，如果灾厄大于或等于剩余生命，就会被一道闪电劈倒。这时乌云会变暗、开始闪电，血条也会变成紫色提醒你。</li>
<li>灾厄不会自己消退。「精神过载」和「预借时间」会把灾厄加到你自己身上，小心别让它超过自己的生命。</li></ul>
<h3>👻 灵魂、虚无、保留</h3><ul>
<li><b>灵魂</b>：0 费，抽 2 张牌，消耗（灵魂+ 抽 3 张）。很多牌会把灵魂塞进你的牌堆。</li>
<li><b>虚无</b>：回合结束时还在手里就会被消耗。有不少牌靠「本场打出过几张虚无牌」变强。</li>
<li><b>保留</b>：回合结束时不弃掉，留到下回合。「雕琢打击」和「猛咬」可以给别的牌加上虚无或保留。</li></ul>
<h3>🃏 88 张牌</h3><ul>
<li>基础 4 张、普通 20 张、精良 36 张、稀有 26 张、远古 2 张（禁忌魔典、守护者），另有「灵魂」和「扫荡凝视」两张衍生牌。效果和数值按原版来。</li>
<li>三条主要路线：<b>小猫流</b>（召唤 + 小猫连击）、<b>灾厄流</b>（叠灾厄，等敌人自己倒下）、<b>灵魂流</b>（灵魂过牌 + 萦绕 / 灵魂风暴）。</li>
<li>图鉴新增「☂️ 契约师卡牌」分页。</li></ul>
<h3>🎒 专属遗物和药水</h3><ul>
<li>遗物：⚱️ 束缚命匣（初始）、🦴 骨笛、🔪 修书刀、🎭 葬礼面具、🎩 大帽子、🔖 书签、🀄 象牙牌、🔯 不死印记、🏺 解放命匣（Boss）。</li>
<li>药水：🍲 骨汤（召唤 15）、🫙 食尸鬼罐（2 张灵魂进手牌）、🌩️ 灾厄药水（33 层灾厄）。</li></ul>
<h3>🎬 动作</h3>
${mdTable(`| 出牌 | 雨天散步等普通外观 | 星光公主 |
|---|---|---|
| 普通攻击 | 举伞，敌人头顶出现雨云下雨 | 举起法杖发光，召唤流星砸下去 |
| 大伤害攻击 | 乌云 + 闪电 | 一颗大流星 |
| 群攻 | 每个敌人头上都下雨 | 流星雨 |
| 防御 | 伞变大，格挡越高伞越大 | 展开星空屏障，把公主和骑士都罩住 |
| 召唤 | 小猫变大 | 骑士变大 |
| 小猫 / 骑士攻击 | 跑过去挠、咬、扑 | 冲过去挥剑 |
| 灾厄 | 一朵乌云飘到敌人头上 | 一朵紫色星云飘过去 |
| 能力牌 | 转一圈伞 | 法杖放光 |`)}
<h3>🎨 外观</h3>
${mdTable(`| 外观 | 价格 |
|---|---|
| 雨天散步（紫发、黄伞、虎斑猫） | 免费 |
| 樱花伞（粉发、粉伞、小白猫） | 💎 800 |
| 夜雨（银发、深蓝伞、小黑猫） | 💎 1500 |
| 橘子汽水（橘伞、薄荷裙、大橘猫） | 💎 2000 |
| 星光公主（公主 + 骑士） | 💎 3000 |`)}
<h3>⚖️ 平衡参考</h3><p>模拟器只带初始遗物，每条路线各跑一套牌组，下面是胜率：</p>
${mdTable(`| 角色 | 第 2 层 Boss | 第 3 层 Boss | 第 2 层精英 | 第 3 层精英 |
|---|---|---|---|---|
| 骑士 | 72% | 25% | 88% | 85% |
| 影刃刺客 | 80% | 48% | 92% | 67% |
| 猪煲 | 75% | 15% | 96% | 75% |
| 阿浣 | 70% | 24% | 94% | 69% |
| 亡灵契约师 | 67% | 25% | 94% | 63% |`)}
<p>三条路线里，灾厄流最稳；小猫流和灵魂流打第 3 层 Boss 比较吃力。</p>
<h3>和原版不一样的地方</h3><ul>
<li>小猫不会死，只会躲起来（原版的奥斯提会被打死）。</li>
<li>为了跟我们这边的敌人强度对齐，初始生命从 66 提到 70，束缚命匣多了「战斗开始时召唤 3」。</li>
<li>「预借时间」用的是早期版本：给自己 3 层灾厄，获得 1（升级后 2）点能量。</li>
<li>「禁忌魔典」的「永恒」暂时只是标注，商店删牌还是能删掉它。</li></ul>
<h3>🏅 成就</h3><ul><li>新增「雨天的契约」（解锁契约师）和「大猫猫」（一场战斗里把小猫召唤到 40 点生命上限）。</li></ul>`},
{v:'1.9.2',date:'2026-11-11',tag:'外观',title:'铁罐每装一个模块都会变样子，1 级和 2 级也不一样',lead:'以前在「空壳」阶段只有特斯拉线圈会显示出来，装炮管、钻头这些都看不到变化。现在不管铁罐处在哪个阶段，每装上一个模块都会长出对应的部件；把模块升到 2 级，部件也会跟着升级换样子。',
 body:()=>`${mdTable(`| 模块 | 1 级 | 2 级 |
|---|---|---|
| 💥 炮管 | 一截短炮管，缠一圈胶带 | 加长炮管，缠三圈胶带，炮口发橙光 |
| 🔩 钻头 | 车头一个小钻头 | 换成大号钻头，钻纹烧得发红（空壳阶段是带橙色火花的小钻头） |
| 🛡️ 轮毂盾 | 车身侧面挂一面银色轮毂盾 | 盾心变成金色，外圈多一道青色能量环 |
| 🧲 磁铁 | 炮塔顶上竖一根杆，顶着一块小马蹄磁铁 | 变成一台小吊臂，吊着一块大磁铁，下面有磁力火花 |
| ⚡ 特斯拉线圈 | 线圈加两根短天线 | 天线伸长，线圈发光，顶上冒电火花 |`)}
<ul><li>车身还是按模块数变化：0–2 个是小底盘，3 个以上换成黄色车身和大履带。</li>
<li>修好了没装轮毂盾时，车身左上角露出一小块盾牌边的问题。</li>
<li>铁罐稍微往右挪了一点，模块图标也往上挪了，完全体时不会再挡住天线和浣熊。</li></ul>`},
{v:'1.9.1',date:'2026-11-11',tag:'外观',title:'阿浣两只眼睛一样大了',lead:'阿浣左眼原来只有 1 格宽，右眼是 2 格宽，看起来一大一小。现在两只眼睛都是 2×3 格，所有皮肤都已修正。',body:()=>''},
{v:'1.9',date:'2026-11-11',tag:'新角色',title:'第四位角色：拾荒机械师「阿浣」和他的铁罐',lead:'一只拿着扳手的小浣熊，带着自己从废料堆里拼出来的坦克机器人「铁罐」下深渊。阿浣负责捡零件、敲敲打打；铁罐每回合结束时自己行动，装的模块越多越强，装满会变成完全体战车。用任意角色累计成功撤离 5 次后解锁。',
 body:()=>`<h3>🦝 阿浣</h3><ul>
<li>生命 70，初始遗物 🧰 工具腰带（每场战斗开始获得 4 零件）。</li>
<li>初始牌组：敲打 ×4、遮挡 ×4、拆解、组装。</li>
<li><b>解锁</b>：用任意角色累计成功撤离 5 次。主菜单「开始远征」的角色选择里，没解锁时显示为黑色剪影。</li></ul>
<h3>⚙️ 零件</h3><ul>
<li>阿浣的专属资源。打牌、击杀敌人（每个 +4）都能获得。</li>
<li>有些牌右上角有齿轮小标，表示打出需要消耗这么多零件，零件不够时打不出来。</li>
<li>战斗胜利时，剩下的零件会换成金币（最多 20）。</li></ul>
<h3>🤖 铁罐</h3><ul>
<li><b>铁罐永远不会被敌人攻击</b>，敌人只打阿浣。</li>
<li>每回合结束时，铁罐会让身上每个模块各行动一次。</li>
<li>一开始有 3 个模块位，「扩展槽」能加到最多 6 个。装同种模块会把它升到 2 级；模块位满了再装，会先拆掉最早装的那个。</li>
<li><b>三种形态</b>：<br>0–2 个模块是「空壳」，只有小底盘加炮塔；<br>3–4 个模块是「改装」，长出履带、车身和排气管，调校 +1；<br>5 个以上是「完全体」，整辆战车成型，调校 +3，每回合主炮额外打 10 点。</li>
<li><b>调校</b>：让钻头、护盾、炮管的数值增加。</li></ul>
${mdTable(`| 模块 | 每回合结束 | 拆下时爆发 |
|---|---|---|
| 🔩 钻头 | 对最前面的敌人造成 8 点伤害（2 级 12） | 伤害 ×4 |
| 🛡️ 轮毂盾 | 阿浣获得 6 点格挡（2 级 9） | 格挡 ×3 |
| 💥 炮管 | 随机打 2 发，每发 4 点（2 级 3 发，每发 5） | 发射次数 ×2 |
| 🧲 磁铁 | 获得 3 零件（2 级 4） | 零件 ×4 |
| ⚡ 特斯拉线圈 | 下回合 +1 能量 | 立刻 +2 能量 |`)}
<p>拆下模块会返还 2 零件。</p>
<h3>🃏 77 张卡牌，三种玩法</h3><ul>
<li><b>重装机甲</b>：多装模块、叠调校，尽快变成完全体，让铁罐替你打。</li>
<li><b>废料投掷</b>：攒零件，用「扔废铁」「垃圾炮」「废料雨」把零件当子弹砸出去。</li>
<li><b>拆装循环</b>：反复装上再拆下，靠拆下时的爆发和「回收利用」类的牌滚雪球。</li>
<li>🛡️ <b>铁罐挡刀</b>（2 费，升级后 1 费）：铁罐冲到阿浣面前自爆，拆下所有模块（各返还 2 零件），这回合敌人的伤害全部由它扛下。适合预感这回合要挨一大刀的时候用。</li>
<li>图鉴新增「🦝 阿浣卡牌」分页。</li></ul>
<h3>🎒 新遗物</h3><ul>
<li>🧰 工具腰带（初始）、📦 零件箱、🛢️ 油壶、🔋 旧机器人核心、🧤 磁铁手套、🛠️ 万用工具箱、⚙️ 变速齿轮箱（Boss）、🏵️ 黄金齿轮（传说）。</li></ul>
<h3>🎨 外观</h3>
${mdTable(`| 外观 | 价格 |
|---|---|
| 小浣熊 | 免费 |
| 灰毛浣熊 | 💎 800 |
| 小熊猫 | 💎 1500 |
| 安全帽 | 💎 2000 |
| 黄金工坊（铁罐也会变成金色） | 💎 3000 |`)}
<h3>⚖️ 平衡参考</h3><p>模拟器只带初始遗物，每种玩法各跑一套牌组，下面是胜率：</p>
${mdTable(`| 角色 | 第 2 层 Boss | 第 3 层 Boss | 第 2 层精英 | 第 3 层精英 |
|---|---|---|---|---|
| 骑士 | 72% | 25% | 88% | 85% |
| 影刃刺客 | 80% | 48% | 92% | 67% |
| 猪煲 | 75% | 15% | 96% | 75% |
| 阿浣 | 70% | 24% | 94% | 69% |`)}
<p>三种玩法里，重装机甲后期最强，拆装循环最吃操作。</p>
<h3>🏅 成就</h3><ul><li>新增「捡破烂的来了」（解锁阿浣）和「废铁战车」（铁罐第一次变成完全体）。</li></ul>`},
{v:'1.8',date:'2026-11-11',tag:'界面',title:'卡牌换新外观 · 音乐和音效可以分别调音量',lead:'卡牌改成了《杀戮尖塔2》那种简洁清楚的风格：卡框按角色上色，名字写在彩色横幅上，下面一块深色文字框。右下角新增 🎚️ 按钮，可以分别调节音乐和音效的音量。',
 body:()=>`<h3>🃏 新卡面</h3><ul>
 <li><b>卡框颜色按角色</b>：骑士蓝色，影刃刺客灰色，猪煲粉色，万能牌白色加流动的彩虹边框，状态牌深灰色。</li>
 <li><b>名字横幅按稀有度</b>：基础 / 普通银灰，精良蓝色，稀有金色，远古橙色，万能彩虹。升级过的牌名字是绿色带 +。</li>
 <li><b>画框形状按类型</b>：攻击牌下边是尖的，技能牌是方的，能力牌顶部是圆拱。画框下面有一块小金牌写着「攻击 / 技能 / 能力」。</li>
 <li>左上角的费用改成了宝石，颜色跟着角色走。</li>

 <h3>🎚️ 音量</h3><ul>

 <li>设置面板里也有这两个滑条。</li>

{v:'1.7',date:'2026-11-11',tag:'音乐',title:'加入背景音乐',lead:'以前的背景音只是一段低沉的嗡嗡声加几个随机音符。现在每个场景都有自己的原创小曲，切换场景时会淡入淡出。',

 |---|---|
 | 营地 / 主菜单 | 84 拍，C 大调，篝火边的慢歌 |
 | 地图 / 岔路 / 战利品 | 100 拍，D 多利亚调式，拨弦琶音的探险曲 |

{v:'1.6.2',date:'2026-11-11',tag:'修复',title:'修复「回味无穷」卡死游戏',lead:'回合内第一张牌就打「回味无穷」时，游戏会直接卡死。已修复。',
 body:()=>`<ul>
 <li><b>原因</b>：「回味无穷」会让每回合打出的第一张牌再打一次。它自己被当成第一张牌时，会把自己再打一次；这又多了一层回味无穷，于是又要再打一次……无限循环，游戏卡死（后台还在跑，所以关掉画面后还能听到声音）。</li>
 <li><b>现在</b>：「再打一次」的次数按打出这张牌之前身上的层数来算，刚打出的这张回味无穷不会给自己加次数，和原作一样。</li>
 <li>之后照常生效：从下一回合开始，每回合打出的第一张牌会再打一次。</li>
 <li>另外加了一道保险：同一张牌最多被额外重复打 10 次。</li></ul>`},
{v:'1.6.1',date:'2026-11-11',tag:'修复',title:'仓库界面：不再闪烁 · 固定左右布局',lead:'修好了拖动遗物时整个界面闪回主界面的问题；出发准备改成固定的左右布局。',
 body:()=>`<ul>
 <li><b>不再闪烁</b>：以前每放一次东西，面板都会重新播放一遍打开动画，看起来像闪回主界面。现在只有第一次打开时才播放。</li>
 <li><b>滚动位置保留</b>：拖完东西后，面板和仓库的滚动位置不会再跳回顶部。</li>
 <li><b>固定左右布局</b>：左边从上到下是角色、安全箱、背包，右边是仓库。窗口小的时候也不会再变成上下排列。</li>
 <li>仓库的列数会按窗口宽度自动调整，窗口越宽一行摆得越多，不用一直上下滚动。</li></ul>`},

{v:'1.5.3',date:'2026-11-11',tag:'外观',title:'小猪长出了卷尾巴',lead:'所有猪煲皮肤的屁股后面都加了一条会摇的卷尾巴。',

{v:'1.5.1',date:'2026-11-11',tag:'外观',title:'猪煲重画 · 小王子猪',lead:'猪煲换成了侧身的像素小猪，头朝右边、面向敌人。身体拆成了好几个部分，动作更有小猪的样子。最贵的皮肤换成了「小王子猪」。',

{v:'1.5',date:'2026-11-11',tag:'新角色',title:'第三位角色「猪煲」开饭啦 🐷',lead:'一只爱吃的小猪，玩法一比一照搬《杀戮尖塔2》的故障机器人：把食物摆上餐盘，每回合自动帮忙，攒好厨艺一起出锅。同时加入 3 种状态牌和 4 只会塞状态牌给你的新怪。',
 body:()=>`<h3>🐷 猪煲</h3><ul>
 <li><b>解锁</b>：任意角色击败第 2 层 Boss。指令面板里也可以直接解锁。</li>
 <li><b>75 生命</b>，初始牌组 4 拱一拱、4 缩成团、切胡萝卜、双份开饭，和原作一样。</li>
 <li><b>初始遗物「保温饭盒」</b>：每场战斗开始时备菜 1 份胡萝卜，并获得 1 点厨艺（第 2 层起为 2 点）。</li>
 <li><b>86 张卡牌（含 2 张远古卡）数值一比一照搬原作</b>（5 张联机专属牌除外），图鉴里新增「猪煲卡牌」分页，最下面有和原作的完整对照表。</li></ul>
 <h3>🥕 食物 = 充能球</h3>
 ${mdTable(`| 食物 | 原作 | 每回合（被动） | 出锅（激发） |
 |---|---|---|---|
 | 🥕 胡萝卜 | 闪电 | 随机敌人 3 伤害 | 随机敌人 8 伤害 |
 | 🥬 白菜 | 冰霜 | 2 格挡 | 5 格挡 |
 | 🎃 南瓜 | 黑暗 | 自身 +6 | 对血最少的敌人造成储存的伤害 |
 | 🍯 蜂蜜 | 等离子 | 回合开始 +1 能量 | +2 能量 |
 | 🧅 洋葱 | 玻璃 | 全体 4 伤害后 -1 | 全体 2 倍伤害 |`)}
 <ul><li>餐盘 = 充能球栏位，默认 3 个、最多 10 个。餐盘满了再备菜，会先把最早的那份出锅。</li>
 <li>厨艺 = 集中，加到除蜂蜜以外所有食物的数值上。</li>
 <li>食物会围着小猪漂浮，最前面那份会发光。光束类的牌会让胡萝卜在身前变大，然后撞向敌人。</li></ul>
 <h3>👗 皮肤</h3><ul><li>花花小猪（免费）、小厨师 💎800、雨衣小猪 💎1500、睡衣小猪 💎2000、表情包小猪 💎3000。</li></ul>
 <h3>🍲 远古卡：偏食 / 四喜丸子</h3><ul>
 <li>原作里只能从特殊事件拿到。在这里：用猪煲击败<b>困难</b>难度的 Boss 后，岔路口会多出「循着香味走」。</li>
 <li>选择它会额外打一场 Boss 战：上古凶兽<b>饕餮</b>（会塞口水黏液和饿肚子、吞你的牌，半血进入第二形态）。打赢后二选一拿走 1 张远古卡。</li>
 <li>不想打可以直接撤离，或者进入下一层。每层最多一次。</li></ul>
 <h3>🃏 新状态牌</h3><ul>
 <li><b>口水黏液</b>（黏液）：1 费，抽 1 张牌，消耗。</li>
 <li><b>饿肚子</b>（虚空）：无法打出，虚无；抽到时失去 1 点能量。</li>
 <li><b>能量零食</b>（燃料）：0 费，获得 1 点能量（升级后 2 点），消耗。猪煲的「压缩打包」会把手里的状态牌变成它。</li></ul>
 <h3>👾 新怪物（所有角色都会遇到）</h3>
 ${mdTable(`| 名字 | 类型 | 出没 | 特点 |
 |---|---|---|---|
 | 馋嘴鬣狗 | 小怪 | 第 1~3 层 | 舔你一口，塞 1 张口水黏液 |
 | 饥饿飞蛾 | 小怪 | 第 1~3 层 | 吸食时把饿肚子洗进你的抽牌堆 |
 | 黏液魔像 | 精英 | 第 2~3 层 | 一次喷 3 张口水黏液，还会叠力量 |
 | 虚空水母 | Boss | 第 2 层 | 「饥渴」：你每抽到一张饿肚子，它获得 8 格挡 |
 | 饕餮 | 特殊 Boss | 远古卡事件 | 只为猪煲出现 |`)}
 <h3>⚖️ 平衡（模拟器，只带初始遗物，3 套构筑平均）</h3>
 ${mdTable(`| 角色 | 第 2 层 Boss | 第 3 层 Boss | 第 2 层精英 | 第 3 层精英 |
 |---|---|---|---|---|
 | 骑士 | 72% | 25% | 88% | 85% |
 | 影刃刺客 | 80% | 48% | 92% | 67% |
 | 猪煲 | 75% | 15% | 96% | 75% |`)}
 <ul><li>只调整了猪煲的初始遗物，卡牌数值一张没动。保温饭盒原本只备 1 份胡萝卜，猪煲打第 2 层 Boss 只有 42% 胜率，所以加上了厨艺。</li>
 <li>模拟器不太会玩猪煲（不爱留能量、不会算抽牌的价值），第 3 层 Boss 的数字偏低。实际体验如果觉得太难或太简单，告诉我，再调。</li>
 <li>表里骑士和刺客的数字是加入新怪物（包括虚空水母和黏液魔像）之后重新跑的。</li></ul>`},
{v:'1.4.2',date:'2026-11-10',tag:'机制',title:'重开战斗 = 一模一样再打一遍',lead:'以前重开战斗会重新洗牌、重新随机敌人血量和意图，可以借重开刷起手牌。现在重开会完全复现这场战斗。',
 body:()=>`<ul><li>每场战斗开始时会记下一个随机种子，重开时沿用同一个种子。</li>

 <li>只要你的打法和上次一样，之后发生的随机事件（比如随机目标、敌人的随机招式、洗牌）也会和上次一样；打法不同，结果才会不同。</li>

{v:'1.4.1',date:'2026-11-10',tag:'外观',title:'Boss 全部重画 · 骸骨雕刻师调整',lead:'12 个 Boss 全部按骑士、刺客的精细度重画，并改成卡通风格；骸骨雕刻师改为全程随机。',

{v:'1.4',date:'2026-11-10',tag:'内容',title:'问号事件大改 · Boss 更有压迫感',lead:'问号事件从 8 个扩到 20 个，每个都有卡通插画和 2~3 个有取舍的选项；所有 Boss 换上了登场演出、专属光环和顶部血条。',
 body:()=>`
 <h3>❓ 问号事件</h3>

   <ul><li><b>骸骨雕刻师</b>：随机删一张牌（免费），或者失去 3 点生命，自己挑一张删。</li>
   <li><b>命运轮盘</b>：免费转一次，可能是金币、遗物、回满血、药水，也可能是伤口或掉血。</li>
   <li><b>熟睡的食人魔</b>：偷它的钱袋（40% 吵醒它，要打一场精英），或者直接偷袭它。</li>
   <li><b>蘑菇圈</b>：吃一个赌运气，或者踩烂它们，打赢 2 只孢子菇换一件遗物。</li>

   <li><b>药剂师小屋</b>：免费拿一瓶药水，或者花 50 金币装满药水栏。</li>
   <li><b>地下角斗场</b>：挑战本层精英，赢了额外拿 100 金币和一件遗物。</li>
   <li><b>废弃保险柜</b>：撬锁换收藏品（5% 大红），或者炸开赌两件。</li>
   <li><b>训练假人</b>：升级一张牌，或者删掉一张基础牌。</li></ul></li>

 <h3>👑 Boss</h3>

 <li><b>体型更大</b>，并有每个 Boss 专属颜色的光环：背后旋转的光芒、脚下发光的法阵、不断升起的火星，身体会缓慢呼吸。</li>

{v:'1.3',date:'2026-11-10',tag:'新系统',title:'药水登场 · 多段克制怪重做',lead:'新增药水系统（3 个栏位、15 种药水）；骸骨王的死亡律动改成按能量算，荆棘和可塑不再按次数惩罚多段攻击；Boss 词缀在地图上提前可见；敌人掉落更显眼。',
 body:()=>`
 <h3>🧪 药水</h3>
 <ul><li>每局自带 <b>3 个药水栏位</b>，显示在顶栏遗物左边。点击药水可以使用或丢弃。</li>
 <li><b>获得方式</b>：精英和 Boss 必定掉 1 瓶；普通战斗 40% 概率掉落，没掉时下次 +10%，掉了下次 -10%（同杀戮尖塔）；商店每次卖 3 瓶。</li>
 <li><b>15 种药水</b>：
   <ul><li>普通：火焰药水（单体 20 伤害）、爆炸药水（全体 10 伤害）、格挡药水（12 格挡）、虚弱药水、恐惧药水（易伤）、迅捷药水（抽 3）、毒药瓶（7 层中毒）。</li>
   <li>精良：力量药水（+2 力量）、能量药水（+2 能量）、回复药水（回复 20% 生命，战斗外也能喝）、净化药水（清除负面效果并获得 6 格挡）、刺客专属飞刀匣（生成 3 把飞刀）、骑士专属勇气药水（+3 勇气）。</li>
   <li>稀有：幽魂之瓶（本回合每次只受 1 点伤害）、瓶中精灵（被动：阵亡时自动以 30% 生命复活）。</li></ul></li>
 <li>需要目标的药水：只有一个敌人时直接生效，否则点击敌人选择目标。</li>
 <li>栏位满了时，奖励页和商店会提示你先丢弃一瓶。药水不算收藏品，撤离和阵亡都不会带出。</li>
 <li>练习模式新增「🧪 药水」页签，可以带最多 3 瓶进练习。</li></ul>
 <h3>💓 骸骨王 · 死亡律动</h3>
 <ul><li>改为「你每消耗 1 点能量，受到 2 点伤害」，0 费牌和诡诈免费打出的牌不触发。两个角色每回合花的能量差不多，掉血也差不多。</li>
 <li>模拟器（第 3 层、无词缀）：骑士 11% → 22%，刺客 28% → 53%。刺客的诡诈流打它特别顺，因为诡诈打出的牌不花能量。</li></ul>
 <h3>🌵 荆棘 · 🫠 可塑</h3>
 <ul><li>荆棘：同一张牌打多段只反伤一次，0 费牌不触发。</li>
 <li>可塑：同一张牌打多段只加一次格挡，0 费牌不触发。</li>
 <li>以前飞刀流打带荆棘的 Boss，一回合可能反伤 40 点；现在按实际花费的牌算，和骑士差不多。</li></ul>
 <h3>🗺️ Boss 词缀提前可见</h3>
 <ul><li>第 4 层起 Boss 会带深渊词缀。现在把鼠标放在地图的 Boss 节点上，就能看到它这次带了哪些词缀和具体效果，可以提前规划路线、留血、准备牌组。</li></ul>
 <h3>🎁 掉落更显眼</h3>
 <ul><li>敌人掉东西时，倒下的位置会弹出大字「🎁 xx 金币！/ 卡牌！/ 遗物！」并亮起金光。</li>
 <li>奖励页：顶部有一条闪烁的「意外收获 ×N」提示；掉落的金币单独列一行，不再混进战斗金币里；掉落的卡牌和遗物也都带 🎁 标记。</li></ul>`},
{v:'1.2.1',date:'2026-11-10',tag:'修复',title:'修复「继续远征」后卡死',lead:'刷新页面后点「继续远征」，如果安全箱或背包里有东西，进入战斗或地图时界面会只剩战场画面。',
 body:()=>`<ul><li>原因：主界面的仓库会把整理模式设为「基地」，继续远征时没有切回「本局」，顶部栏统计背包占用时找不到物品，渲染中断。只要安全箱或背包里有东西就会触发，和刺客、Boss 无关。</li>
 <li>修复后：继续远征会正确切换到本局背包；就算以后再遇到找不到的物品，也会跳过而不是卡住。</li>

{v:'1.1.1',date:'2026-11-10',tag:'修复',title:'修复击败 Boss 后卡住',lead:'v1.1 引入的严重问题：击败任何 Boss 后，战斗界面不会进入奖励页面。',
 body:()=>`<ul><li>修复：击败 Boss 后弹出成就，然后一直停在战斗界面（敌人已消失，无法继续）。原因是 v1.1 新加的「宝箱怪额外掉落」判断在战斗数据清空之后才读取，导致结算中断。骑士和刺客都会受影响。</li>

{v:'1.1',date:'2026-11-10',tag:'新内容',title:'新怪物、新 Boss、新遗物与「大红」',lead:'每层新增 2 种小怪、1 种精英和 1 个 Boss，共 13 种新敌人，各有自己的机制；新增 11 件遗物和 6 件「大红」收藏品，出大红有全屏演出。',

 <li><b>头部</b>：尖兜帽改成贴合头型的圆兜帽，帽檐下一道阴影露出眼睛，再加一块面巾，不会再有「尖脑袋」。鸦羽、白鹭皮肤的羽毛对齐新头型。</li>
 <li><b>匕首</b>：刀身改成 1 像素细刃，变短；右手正握斜向前，左手反握斜向下，不再竖直。主界面的立绘也拿上了匕首。</li></ul>
 <h3>👻 幽灵皮肤</h3>
 <ul><li>重新画成一整块浮空的幽冥披布：漆黑的脸里两只发光的大眼，下摆破碎，拖着一缕弯曲的幽烟。匕首拿在两只袖口。</li>
 <li>修复：选择幽灵后，主界面立绘位置偏下、被裁掉一半。</li></ul>
 <h3>🎬 动作重做</h3>
 <ul><li>攻击：刺击是闪现到背后一刀；暗影突袭穿身而过；背刺从烟雾里出现；割喉是一道横向红线；连环斩按当前连段砍出 2~6 刀；毒针连戳四下；瞬影斩先蓄势再拔刀闪过；暗杀跳出屏幕再从天而降；致命一击先让屏幕变暗。</li>
 <li>飞刀：扇形飞刀会转一圈向所有敌人各扔 3 把；刀雨跳起向下扔；千刃的刀数跟连段一起变多。</li>
 <li>毒：涂毒类会扔出一个旋转的毒瓶；催化是一圈圈毒泡；毒雾是一团向前推的绿雾；标记会出现一个红色准星。</li>
 <li>防御：闪避后撤、翻滚、后空翻、侧步、双刀交叉招架、消失在烟里、致盲药粉、无痕虚化，各不相同。</li>
 <li>过牌：杂技会抛接匕首；赌博把牌甩出去；刀刃之舞让 5 把匕首绕身体旋转；能力牌按种类有不同颜色和效果（夜幕会让场景变暗）。</li></ul>
 <h3>🔧 其他</h3>
 <ul><li>修复：击败第 4 层及以后的 Boss 后，主界面底部显示「最高击破 undefined Boss」，现在显示「第 N 层 Boss」。</li></ul>`},
{v:'1.0',date:'2026-11-10',tag:'新角色',title:'新角色：影刃刺客',lead:'第二位回收者登场。生命更少，但一回合能打出一大串牌：连段、飞刀、毒与诡诈。用骑士击败第 1 层 Boss 即可解锁。',
 body:()=>`
 <h3>🗡️ 影刃刺客</h3>
 <ul><li><b>解锁</b>：用骑士第一次击败第 1 层 Boss（任意难度）。主界面「🧪 指令」里也可以一键解锁。解锁后点「开始远征」会先让你选择角色。</li>
 <li><b>数值</b>：生命 72（骑士 80），初始牌组 12 张：刺击 ×5、闪避 ×5、淬毒匕首、伺机而动。</li>
 <li><b>初始遗物 · 暗影斗篷</b>：每回合多抽 1 张牌，第一回合多抽 2 张；战斗结束回复 3 点生命。</li>
 <li><b>新关键词</b>：<b>连段</b>（本回合已打出的牌数，能量球旁边有计数）、<b>飞刀</b>（0 费攻击，5 点伤害，消耗）、<b>诡诈</b>（在你的回合被弃置时免费打出）、<b>弃</b>（弹出选择框，诡诈牌会发紫光提示）。</li>
 <li><b>52 张专属卡牌、10 件专属遗物</b>，图鉴里新增「刺客卡牌」分页。骑士的斗志、冲锋类遗物不再出现在刺客的局里，反之亦然。</li></ul>
 <h3>⚔️ 三个流派</h3>
 <ul><li><b>☠️ 毒刃</b>：涂毒、毒雾、催化、剧毒之雾、尸爆，稳扎稳打，怕人工制品。</li>
 <li><b>🗡️ 飞刀</b>：刀刃之舞、无尽刀锋、千刃、影杀，一回合十几张牌，怕死亡律动、时间扭曲和可塑。</li>
 <li><b>🃏 诡诈</b>：杂技、暗器、瞬影斩、狡诈之心、计算的赌博，操作最复杂，上限最高。</li></ul>
 ${NEWS_DECKS_A.map(a=>`<div class="narch"><div class="nah"><b>${a.name}流</b><span class="muted"> · 测试牌组 · 万能牌 ${CARDS[a.uni].n}</span></div>${['s1','s2','s3'].map((s,i)=>`<div class="ndr"><span class="ndl">第 ${i+1} 层 · ${a[s].length} 张</span><div>${deckLine(a[s])}</div></div>`).join('')}</div>`).join('')}
 <h3>⚖️ 两个角色的平衡测试</h3>
 <p>和骑士用同一套模拟：只带初始遗物，打普通难度 Boss，每层 3 个 Boss × 40 场。</p>
 <div class="ntw"><table class="ntab"><thead><tr><th>流派</th><th>第 1 层</th><th>第 2 层</th><th>第 3 层</th></tr></thead><tbody>
 <tr><td>骑士 · 铁壁反击</td><td>100%</td><td>63%</td><td>52%</td></tr>
 <tr><td>骑士 · 斗志审判</td><td>100%</td><td>83%</td><td>15%</td></tr>
 <tr><td>骑士 · 冲锋骑兵</td><td>100%</td><td>78%</td><td>10%</td></tr>
 <tr><td><b>骑士平均</b></td><td><b>100%</b></td><td><b>75%</b></td><td><b>26%</b></td></tr>
 <tr><td>刺客 · 毒刃</td><td>100%</td><td>80%</td><td>45%</td></tr>
 <tr><td>刺客 · 飞刀</td><td>100%</td><td>82%</td><td>13%</td></tr>
 <tr><td>刺客 · 诡诈</td><td>98%</td><td>58%</td><td>34%</td></tr>
 <tr><td><b>刺客平均</b></td><td><b>99%</b></td><td><b>73%</b></td><td><b>31%</b></td></tr>
 </tbody></table></div>
 <p>带上一局常见的遗物后，两个角色打第 2、3 层普通 Boss 都在 77%～100% 之间，刺客没有出现「带遗物就无敌」的流派。为了达到这个结果，刺客在测试中做了这些调整：生命 64 → 72、斗篷改为每回合多抽 1 张、闪避 5 → 6、飞刀 4 → 5、多张防御牌和毒牌数值上调、千刃改为 1 费、计算的赌博升级后也会消耗、狂乱刀雨改为 2 费且最多 4 把飞刀、狡诈之心 4 → 3。</p>
 <p class="muted">已知差距：第 3 层精英战刺客的胜率（约 55%）低于骑士（约 73%），主要输在「食人魔」和「死亡骑士 + 毒蛛」这两组，之后会继续观察。另外「激愤」现在每回合最多触发 3 次，对多段攻击更公平。</p>
 <h3>🎨 形象与动作</h3>
 <ul><li>白袍尖兜帽、红腰带、残月徽记、双持短匕，袍摆会随风飘动。五套外观：白鹰、夜鸦（黑羽）、赤蝎（蝎尾）、白鹭（白羽金饰）、幽灵（浮空半透明）。</li>
 <li>攻击：闪到敌人背后背刺、贴身 X 字快斩、真的把飞刀丢出去、投掷毒瓶、毒雾漫开、千刃从天而降、影杀时画面一暗再一道红线。幽灵外观的攻击会直接穿过敌人身体。</li>
 <li>格挡用「影幕」烟雾表现，格挡越高烟越浓；完全挡住会侧身闪避，挡住一部分是双匕交叉「叮」地格开，被打穿时影幕散成一团烟。</li>
 <li>连段 ≥ 5 身后出现残影，≥ 10 两个。🥚 一回合连段达到 15，变身「影之王」。</li></ul>
 <h3>其他</h3>
 <ul><li>成就新增：刺客的三枚征服徽章、新的影子、行云流水（一回合连段 10）、影之王。</li>
 <li>练习模式可以选择角色，并提供刺客三个流派的预设牌组。</li>
 <li>外观页面分角色显示。地图头像、主界面立绘、战斗名牌都会跟随所选角色。</li></ul>`},
{v:'0.9.2',date:'2026-11-10',tag:'美术',title:'卡牌边框、高级骑士重做与黄金王者',lead:'一次视觉升级：越稀有的牌越华丽，高级骑士换了新头盔、新大剑和专属起手式，黄金王者真正金光闪闪了。',
 body:()=>`
 <h3>🃏 稀有度边框</h3>
 <ul><li><b>基础</b>：朴素边框。<b>普通</b>：加一圈细内框。</li>
 <li><b>精良</b>：银色金属内框 + 银钻角标，名字带冷光。</li>
 <li><b>稀有</b>：流动的金色内框 + 红宝石角标 + 外发光，卡面不时掠过一道光。</li>
 <li><b>万能</b>：流转的彩虹内框 + 青色宝石，同样带扫光。</li></ul>
 <h3>⚜️ 高级骑士重做</h3>
 <ul><li>身形更魁梧（肩甲更宽），头盔改成带中脊和 V 形面甲的尖顶盔，并按外观区分：见习骑士红缨、赤焰骑士火焰盔冠、白银圣骑双翼、暗夜骑士高耸弯角、黄金王者镶钻王冠。</li>
 <li>大剑更长，五套外观各不相同：钢铁长剑、熔火之刃、寒冰水晶剑、黑刃青光、黄金王剑，剑身带外观色辉光。</li>
 <li><b>起手式</b>：变身后攻击动作完全不同——
  <br>· 斩击类：双手将大剑竖立身前蓄力，再举过头顶猛劈，落点炸开震地波；跃斩会先腾空。
  <br>· 突刺 / 连击类：拖着大剑向前走一步，剑尖擦地起火花，随后瞬移到敌人面前上撩斩，连击会来回斩三下。
  <br>· 横扫 / 旋风类：大剑横扛肩头、压低身形，冲进敌群旋转两周。</li>
 <li>变身后荣耀誓言的漂浮王冠会收起，不再和头盔重叠。</li></ul>
 <h3>👑 黄金王者</h3>
 <ul><li>金色更亮更纯，不再发土黄。</li>
 <li>王冠更大，三个尖顶镶钻，冠带上嵌红宝石。</li>
 <li>胸甲换成金色纹饰加红宝石与钻石，不再是白十字。</li>
 <li>战马加上金色马面甲和颈甲。</li></ul>`},
{v:'0.9.1',date:'2026-11-10',tag:'新内容',title:'练习模式',lead:'想熟悉新机制、看看某张牌的特效？主界面新增「🎯 练习模式」。',
 body:()=>`<ul>
 <li><b>自选敌人</b>：所有普通怪、精英和 Boss 都能选，普通和精英最多混搭 3 个。悬停可以看生命、招式和特殊机制。</li>
 <li><b>自选卡组</b>：一键套用初始卡组或三大流派各阶段的测试牌组，也可以逐张添加（普通版 / 升级版），点击移除。</li>

 <li><b>练习工具栏</b>：战斗中随时 🃏 发任意牌到手牌（含升级版和状态牌）、⚡ 能量 +3、❤️ 回满、💀 斩杀全部、🚪 退出；重开永远免费。</li>
 <li>练习不会影响存档、晶石、成就、战绩，也不会打断你正在进行的远征。</li></ul>`},
{v:'0.9',date:'2026-11-10',tag:'新内容',title:'怪物机制、重开战斗与背包格式',lead:'后期遗物叠起来之后，怪物只靠数值已经拦不住你了。这个版本参考杀戮尖塔给怪物加上了各种特殊机制，并带来了重开战斗、击杀掉落、新背包和一个小彩蛋。',
 body:()=>`
 <h3>👹 怪物特殊机制</h3>
 <div class="ntw"><table class="ntab"><thead><tr><th>机制</th><th>效果</th><th>谁有</th></tr></thead><tbody>
 <tr><td>🔰 人工制品</td><td>抵消接下来几次负面效果（虚弱、易伤、中毒、锁链）</td><td>哨兵、死亡骑士、堕落骑士团长</td></tr>
 <tr><td>🗿 不屈</td><td>每回合最多受到 X 点伤害，专治一回合打爆</td><td>深渊之龙（110）</td></tr>
 <tr><td>🫠 可塑</td><td>每受到一次攻击伤害就获得格挡，而且越来越多，多段攻击要小心</td><td>黑骑士</td></tr>
 <tr><td>💢 激愤</td><td>每受到一次攻击伤害获得力量</td><td>吸血鬼、食人魔</td></tr>
 <tr><td>🐚 蜷缩</td><td>第一次挨打后立刻获得格挡</td><td>颚虫</td></tr>
 <tr><td>💓 死亡律动</td><td>你每打出一张牌就受到 1 点伤害</td><td>骸骨王</td></tr>
 <tr><td>⌛ 时间扭曲</td><td>你每打出 15 张牌，它强行结束你的回合并获得 1 点力量</td><td>时间吞噬者</td></tr>
 <tr><td>🧐 好奇</td><td>你每打出一张能力牌，它获得 1 点力量</td><td>觉醒者</td></tr>
 <tr><td>🍄 孢子云</td><td>死亡时让你获得 2 层易伤</td><td>孢子菇</td></tr>
 <tr><td>💰 窃贼</td><td>每次攻击偷走 8 金币，击杀它可以拿回来</td><td>地精刺客</td></tr>
 <tr><td>🕸️ 缠绕</td><td>下回合无法打出攻击牌</td><td>毒蛛「结网」</td></tr>
 <tr><td>🐍 收缩</td><td>每回合结束失去 2 点生命，持续整场</td><td>双头巨魔「咆哮」</td></tr>
 </tbody></table></div>
 <p><b>深渊词缀</b>：从第 3 层起，精英会随机带 1 个额外机制（第 5 层起 2 个）；从第 4 层起 Boss 也会带（第 6 层起 2 个，可能抽到「不屈」「死亡律动」「诅咒」）；第 5 层起普通怪也有一半概率带。词缀数值随层数变强。</p>
 <p class="muted">为了抵消新机制，第 2、3 层 Boss 的生命小幅下调：堕落骑士团长 260 → 240，双头巨魔 280 → 260，时间吞噬者 230 → 200，骸骨王 340 → 310，觉醒者 400 → 370。</p>
 <div class="ntw"><table class="ntab"><thead><tr><th>只带初始纹章，普通难度 Boss 胜率</th><th>第 1 层</th><th>第 2 层</th><th>第 3 层</th></tr></thead><tbody><tr><td>铁壁反击</td><td><span class="nb">100%</span> → <b>100%</b></td> <td><span class="nb">74%</span> → <b>63%</b></td> <td><span class="nb">53%</span> → <b>52%</b></td></tr><tr><td>斗志审判</td><td><span class="nb">100%</span> → <b>100%</b></td> <td><span class="nb">84%</span> → <b>83%</b></td> <td><span class="nb">31%</span> → <b>15%</b></td></tr><tr><td>冲锋骑兵</td><td><span class="nb">100%</span> → <b>100%</b></td> <td><span class="nb">83%</span> → <b>78%</b></td> <td><span class="nb">21%</span> → <b>10%</b></td></tr></tbody></table></div>
 <p class="muted">带上常见遗物时，第 3 层普通难度 Boss 三个流派仍然 100% 能过；新机制主要在更深的层数、遗物堆起来以后发挥作用。</p>
 <h3>↺ 重开战斗</h3>
 <p>战斗界面新增「↺ 重开」，回到这场战斗开始时的状态并重新洗牌。每场战斗第一次免费，之后依次：💎5 → 💎10 → 💎20 → 献祭一件遗物 → 💎50 → 献祭遗物 → 💎50 → …… 没有可献祭的遗物时改为 💎50。</p>
 <h3>🎁 击杀掉落</h3>
 <p>每个敌人倒下时有 5% 概率掉东西：一半是金币，三成是一次高品质卡牌选择，两成是遗物。战后搜刮里会出现「意外收获」。</p>
 <h3>🎒 背包格式</h3>
 <p>背包不再用晶石扩容，而是像三角洲一样有不同格式，出发前在「出发准备」里挑一个。同样的格数，格式不同手感完全不同。</p>
 <div class="ntw"><table class="ntab"><thead><tr><th>背包</th><th>格数</th><th>格式</th><th>获取</th></tr></thead><tbody>
 <tr><td>腰包</td><td>6</td><td>3×2</td><td>初始</td></tr>
 <tr><td>斜挎包</td><td>10</td><td>5×2，放不下 3×3</td><td>💎 80</td></tr>
 <tr><td>双肩包</td><td>13</td><td>3×3 + 两个 1×2 侧袋</td><td>💎 200</td></tr>
 <tr><td>登山包</td><td>16</td><td>4×3 + 一个 2×2 顶袋</td><td>💎 400</td></tr>
 <tr><td>战术背包</td><td>20</td><td>4×4 + 两个 1×2 弹匣袋</td><td>🔴 红色藏品价值 400</td></tr>
 <tr><td>远征背包</td><td>20</td><td>5×4 整仓，没有小格</td><td>🔴 红色藏品价值 700</td></tr>
 <tr><td>深渊行囊</td><td>30</td><td>6×5 整仓</td><td>🔴 红色藏品价值 1200</td></tr>
 </tbody></table></div>
 <p class="muted">红色藏品指传说遗物和收藏品，兑换时上交，价值够了就行。之前买过的「背包扩容」等级会自动换成对应的背包，不会亏。</p>
 <h3>⚔️ 骑士</h3>
 <ul><li>力量越高，手里的剑越大（就像格挡越高盾越大）。</li>
 <li>荣耀誓言的王冠抬高了，不再挡住脸。</li>
 <li>🥚 彩蛋：荣耀誓言生效时力量达到 20，骑士会变身<b>高级骑士</b>：更魁梧的身形、金边宝剑，外观跟随你的皮肤。还附送一枚成就「王者之姿」。</li></ul>`},
{v:'0.8',date:'2026-11-10',tag:'新内容',title:'战绩、成就与科技树',lead:'撤离之后终于能看到自己打了多少分；新增成就徽章、科技树式的基地升级，骑士和战马也换上了新装。',
 body:()=>`
 <h3>📜 战绩结算（新）</h3>
 <p>每局结束（撤离或阵亡）都会结算一次分数，结算页逐项列出得分，并记录你的最高战绩。</p>
 <div class="ntw"><table class="ntab"><thead><tr><th>项目</th><th>分数</th></tr></thead><tbody>
 <tr><td>普通战斗</td><td>每场 10 × 层数</td></tr>
 <tr><td>精英战斗</td><td>每场 40 × 层数</td></tr>
 <tr><td>击败 Boss</td><td>简单 100 / 普通 160 / 困难 250，× 层数</td></tr>
 <tr><td>无伤战斗</td><td>每场 15 × 层数（整场没掉血）</td></tr>
 <tr><td>击杀</td><td>每个敌人 2</td></tr>
 <tr><td>最强一击</td><td>本局最高单次伤害（最多 200）</td></tr>
 <tr><td>深入</td><td>抵达的层数 × 60</td></tr>
 <tr><td><b>结局倍率</b></td><td>以上合计：成功撤离 <b>×1.25</b>，阵亡 <b>×0.5</b></td></tr>
 <tr><td>带回价值 + 金币</td><td>只在撤离时计入：遗物价值 + 剩余金币 ÷ 2</td></tr>
 </tbody></table></div>
 <h3>🔧 基地升级改为科技树</h3>
 <ul><li>从「远征营地」出发分成三条线：强化体魄 → 启动资金、安全箱（仍然只靠击败 Boss 扩容）、背包扩容。点节点看详情，再用晶石升级。</li>
 <li><b>📊 战绩换算</b>（新）：需要启动资金和背包扩容各 1 级。撤离或阵亡时，把本局分数的 <b>2% / 4% / 6% / 8% / 10%</b> 换成晶石，费用 150 / 300 / 500 / 800 / 1200。上限 10%，只是个添头。</li></ul>
 <h3>🏅 成就（新）</h3>
 <ul><li><b>征服徽章</b>：简单、普通、困难各一枚，颜色不同，徽章中间的数字是你在该难度击败过的最高层 Boss，打得更深会自动刷新。</li>
 <li><b>纪录徽章</b>：最长连续无伤战斗、最强一击、最高战绩，数字随纪录刷新，边框按铜 / 银 / 金 / 白金分段。</li>
 <li><b>事迹徽章</b> 16 枚：活着回来、死里逃生、满载而归、红色传说、轻装上阵、屠龙者、速战速决、铜墙铁壁、冲锋陷阵、时装达人……达成时屏幕上方会弹出提示。</li></ul>

 <ul><li>披风改成独立的飘动部件：站立时随风摆动，骑马时向后飞扬，不再像背了个包。</li>
 <li>每套外观都有专属战马：赤焰骑士是火鬃红金马铠，白银圣骑是白马蓝金马铠，暗夜骑士是紫鬃黑马，黄金王者是金鬃白马配王室马铠。</li>

 <h3>其他</h3>
 <ul><li><b>🧪 指令</b>：主界面新增测试用指令，可以一键获得 / 减少 100 晶石，方便快速解锁东西，发给朋友试玩时也能用。</li>

{v:'0.7',date:'2026-11-10',tag:'平衡',title:'平衡性调整：骑士三大流派实测',lead:'我们用战斗模拟器把骑士的三种流派从第 1 层一路打到第 3 层，找出了几处明显不合理的数值，并在这个版本一次修好。',

 <tr><td>铠甲骑士（精英）</td><td>初始多层护甲 <span class="nb">8</span> → <b>5</b></td></tr>
 <tr><td>第 2 层遭遇</td><td>暗影刺客 + 地精刺客×2 → <b>暗影刺客 + 地精刺客</b></td></tr>

 <tr><td>食人魔（精英）</td><td>重锤 <span class="nb">24</span> → <b>20</b></td></tr>
 <tr><td>堕落骑士团长</td><td>处刑斩 <span class="nb">28</span> → <b>24</b></td></tr>

 <tr><td>双头巨魔</td><td>再生 <span class="nb">25</span> → <b>18</b></td></tr>

 <h3>测试用的三种流派</h3>

 <h3>测试方法</h3>
 <ul>
 <li><b>出牌 AI</b>：每打一张牌前，把本回合的出牌顺序都试一遍（最多 350 个分支），按造成的伤害、击杀、预计受到的伤害和能力牌的长期价值打分。它比熟练玩家弱一些，所以结果偏保守。</li>

 <li><b>两种场景</b>：严格场景只带骑士纹章；参考场景带上一局里常见的遗物（第 2 层：咖啡滤杯、船锚、磨刀石、铁角盔；第 3 层再加蛇眼戒指、塔盾、装饰扇）。</li>
 </ul>
 <h3>先观察、暂不改</h3>
 <ul>
 <li><b>格挡遗物 + 铁壁阵型</b>：带遗物的铁壁流仍然很轻松，之后可能调整格挡类遗物。</li>

function renderNews(){
  const sel=UI.news||NEWS[0].v;const n=NEWS.find(x=>x.v===sel)||NEWS[0];
  return `<div class="news"><div class="nlist">${NEWS.map(x=>`<button class="nli ${x.v===n.v?'on':''}" onclick="UI.news='${x.v}';render()"><span class="ntag">${x.tag}</span><b>v${x.v}</b><small>${x.title}</small></button>`).join('')}</div>
  <article class="nart"><div class="nmeta"><span class="ntag">${n.tag}</span> v${n.v}${n.date?' · '+n.date:''}</div><h2>${n.title}</h2>${n.lead?`<p class="nlead">${n.lead}</p>`:''}${n.body()}</article></div>`;
}
// ================= score / achievements / tech tree / console =================
function newRunStats(){return {fights:0,elites:0,bosses:[],kills:0,maxHit:0,flawless:0,streak:0,bestStreak:0,pts:{fight:0,elite:0,boss:0,flawless:0},bare:false};}
function rst(){if(!R)return newRunStats();if(!R.st)R.st=newRunStats();return R.st;}
const BOSS_PTS={easy:100,normal:160,hard:250};
function noteHit(un){if(!R||R.practice)return;const s=rst();if(un>s.maxHit)s.maxHit=un;if(un>(M.stats.maxHit||0))M.stats.maxHit=un;if(un>=30)achGet('maxhit');}
function noteWin(kind,n,L,cc){
  const s=rst();
  if(kind==='boss'){const g=n.grade||'normal';s.bosses.push({L,g});s.pts.boss+=BOSS_PTS[g]*L;
    const isA=R.ch==='assassin';const bb=isA?(M.stats.bossBestA=M.stats.bossBestA||{}):M.stats.bossBest;const old=bb[g]||0;if(L>old){bb[g]=L;achGet((isA?'boss_a_':'boss_')+g,true);}
    if(cc.enemies.some(e=>e.k==='dragon'))achGet('dragon');}
  else if(kind==='elite'){s.elites++;s.pts.elite+=40*L;}
  else{s.fights++;s.pts.fight+=10*L;}
  if(!cc.hurt){s.flawless++;s.streak++;s.pts.flawless+=15*L;}else s.streak=0;
  s.bestStreak=Math.max(s.bestStreak,s.streak);
  if(s.streak>(M.stats.bestStreak||0)){const old=M.stats.bestStreak||0;M.stats.bestStreak=s.streak;if(s.streak>=3)achGet('streak',[3,6,10,20].some(t=>old<t&&s.streak>=t));}
  if(cc.turn<=1)achGet('blitz');
}
function runScore(ok,value){
  const s=rst();const L=R.layer||1;
  const rows=[
    ['⚔️ 普通战斗',`${s.fights} 场`,s.pts.fight],
    ['💀 精英战斗',`${s.elites} 场`,s.pts.elite],
    ['👑 击败 Boss',s.bosses.length?s.bosses.map(b=>`${b.L}层${GRADES[b.g].n}`).join('、'):'无',s.pts.boss],
    ['✨ 无伤战斗',`${s.flawless} 场 · 最长连续 ${s.bestStreak}`,s.pts.flawless],
    ['🗡️ 击杀',`${s.kills} 个敌人`,s.kills*2],
    ['💥 最强一击',`${s.maxHit} 点伤害`,Math.min(200,s.maxHit)],
    ['🧭 深入',`抵达第 ${L} 层`,L*60],
  ];
  const sub=rows.reduce((a,r)=>a+r[2],0);
  const mult=ok?1.25:0.5;
  const haul=ok?[['📦 带回价值','仓库里的新遗物',value],['💰 剩余金币',`${R.gold} 金币 ÷ 2`,Math.floor(R.gold/2)]]:[];
  const total=Math.round(sub*mult)+haul.reduce((a,r)=>a+r[2],0);
  const rate=SCORE_RATE[M.up.score||0]||0;const bonus=Math.floor(total*rate/100);
  const best=total>(M.stats.bestScore||0);if(best)M.stats.bestScore=total;
  {const cs=chStat(R.ch||'knight');if(total>(cs.bestScore||0))cs.bestScore=total;}
  if(total>=1000)achGet('bestscore');if(total>=2000)achGet('score2k');if(total>=5000)achGet('score5k');
  return {rows,sub,mult,ok,haul,total,rate,bonus,best};
}
function achOnExtract(items,value){
  achGet('extract1');if(M.stats.extracts>=10)achGet('veteran');
  if(R.hp<=10)achGet('closecall');

function techLv(n){if(n.id==='core')return 1;if(n.safe)return M.safeLv;if(n.bags)return M.bags.length;return M.up[n.up]||0;}
function techMax(n){if(n.id==='core')return 1;if(n.safe)return 3;if(n.bags)return Object.keys(BAGS).length;return UPG[n.up].max;}
function techOpen(n){return !(n.req||[]).some(([id,l])=>{const p=TECH.find(t=>t.id===id);return techLv(p)<Math.max(1,l)&&id!=='core';});}
function techBuy(id){const n=TECH.find(t=>t.id===id);if(!n||!n.up||!techOpen(n)||R)return;buyUpg(n.up);}
function renderTech(){
  const sel=TECH.find(t=>t.id===UI.tech)||TECH[1];
  const lines=TECH.flatMap(n=>(n.req||[]).map(([pid])=>{const p=TECH.find(t=>t.id===pid);const lit=techLv(p)>0&&techOpen(n);return `<line x1="${p.x}%" y1="${p.y}%" x2="${n.x}%" y2="${n.y}%" class="${lit?'lit':''}"/>`;})).join('');
  const nodes=TECH.map(n=>{const lv=techLv(n),mx=techMax(n),open=techOpen(n);const max=lv>=mx;const c=n.up&&!max?UPG[n.up].cost(lv):0;const can=n.up&&open&&!max&&M.crystals>=c&&!R;
    const st=n.id==='core'?'root':!open?'locked':max?'max':can?'can':lv>0?'some':'open';
    return `<button class="tnode t-${st} ${sel.id===n.id?'sel':''}" style="left:${n.x}%;top:${n.y}%" onclick="UI.tech='${n.id}';render()"><span class="ti">${open?n.i:'🔒'}</span>${n.id==='core'?'':`<span class="tp">${'◆'.repeat(lv)}${'◇'.repeat(mx-lv)}</span>`}<span class="tn">${n.n}</span></button>`;}).join('');
  // detail pane
  const lv=techLv(sel),mx=techMax(sel),open=techOpen(sel);let det='';
  if(sel.id==='core')det=`<p>${sel.d}</p><p class="muted">远征 ${M.stats.runs} 次 · 撤离 ${M.stats.extracts} 次 · 最高战绩 ${M.stats.bestScore||0}</p>`;
  else if(sel.bags){det=`<p>已收集 <b>${M.bags.length}</b> / ${Object.keys(BAGS).length} 个背包，当前使用「${BAGS[M.bag].n}」（${bagCap(M.bag)} 格）。</p><p class="muted">背包不再用晶石扩容，而是换成不同格式的背包：基础款用晶石购买，高级款用带出来的红色藏品兑换。</p><button class="gold tbuy" onclick="openPanel('prep')">🎒 去出发准备里挑背包</button>`;}
  else if(sel.safe){const ss=safeSize();det=`<p>阵亡也不会丢失的格子。当前 <b>${ss.join('×')}</b>（${ss[0]*ss[1]} 格）。</p><p class="muted">不能用晶石升级：首次击败一阶 / 二阶 / 三阶 Boss 后，分别扩到 2×2 / 3×2 / 3×3。</p>`;}
  else{const u=UPG[sel.up];const max=lv>=mx;const c=max?0:u.cost(lv);
    const reqTxt=(sel.req||[]).filter(([id])=>id!=='core').map(([id,l])=>{const p=TECH.find(t=>t.id===id);return `${p.i} ${p.n} ≥ ${Math.max(1,l)} 级`;}).join('、');
    det=`<p>${u.d}</p><div class="tval"><span class="muted">当前</span><b>${u.show(lv)}</b>${max?'':`<span class="muted">→</span><b class="nx">${u.show(lv+1)}</b>`}</div>
    ${sel.up==='score'?`<p class="muted" style="font-size:12px">分数按战斗、精英、Boss、无伤、击杀、深入和带回价值计算，撤离 ×1.25、阵亡 ×0.5。换算只是添头，上限 10%。</p>`:''}
    ${!open?`<p class="tlock">🔒 需要先解锁：${reqTxt}</p>`:max?'<p class="tdone">✔ 已满级</p>':`<button class="gold tbuy" ${M.crystals<c||R?'disabled':''} onclick="techBuy('${sel.id}')">💎 ${c} 升级</button>${R?'<p class="muted" style="font-size:12px">远征进行中，回到基地后才能升级。</p>':''}`}`;}
  return `<div class="tech"><div class="ttree"><svg class="tlines" preserveAspectRatio="none">${lines}</svg>${nodes}</div>
  <div class="tdet"><div class="tdh"><span class="tdi">${sel.i}</span><div><b>${sel.n}</b><div class="pips">${sel.id==='core'?'':'◆'.repeat(lv)+'◇'.repeat(mx-lv)}</div></div></div>${det}</div></div>`;
}

function startPractice(){
  const p=pcfg();if(!p.enemies.length||!p.deck.length)return;
  if(!PRACTICE)PRACTICE={realR:R,realC:null};
  const node={id:0,type:'fight',depth:p.layer>=3?5:3,grade:p.grade,ch:[]};
  if(!charUnlocked(p.ch))p.ch='knight';
  R={practice:true,ch:p.ch,hp:p.hp,max:p.hp,gold:500,deck:p.deck.map(([k,u])=>mkCard(k,!!u)),relics:[],act:1,rs:{},removeCost:75,cleared:0,phase:'practice',layer:p.layer,theme:p.theme,
     safe:mkCont([3,3]),bag:mkBag('pouch'),map:{nodes:[node]},pos:0,visited:[0],st:newRunStats()};
  p.relics.forEach(k=>{if(RELICS[k])addRelic(k);});
  R.potions=[null,null,null];(p.pots||[]).slice(0,3).forEach((k,i)=>{if(POTIONS[k])R.potions[i]=k;});
  R.hp=R.max=Math.max(p.hp,1);
  INV=null;UI={screen:'combat'};
  const kind=p.enemies.some(k=>EN[k].boss)?'boss':p.enemies.some(k=>ELITE_K.has(k))?'elite':'fight';
  node.type=kind==='boss'?'boss':kind;
  startCombat(p.enemies.slice(),kind);
}
function endPractice(win){RNGF=null;
  if(!PRACTICE)return;
  const msg=win==null?'':win?'练习胜利':'练习失败';
  R=PRACTICE.realR;C=null;PRACTICE=null;CSNAP=null;closeModal();
  UI={screen:'base',panel:'practice'};render();
  if(msg)setTimeout(()=>banner(msg,win?'#7be07b':'#ff7b81','练习不计入任何进度',1100),60);
}

function relicRow(k,onclick,cls='',id=''){const d=RELICS[k];const [w,h]=relSize(k);return `<div class="item bq-${d.r}${d.big?" bigred":""} ${cls}" ${id?`id="${id}"`:''} ${onclick?`onclick="${onclick}"`:''} data-tip="${esc(relicTip(k))}"><div class="ie">${d.e}</div><div class="grow"><div class="it q-${d.r}">${d.n}<span class="tag">${d.big?'大红':RAR_N[d.r]} · ${w}×${h}</span><span class="tag y">💎${relVal(k)}</span></div><div class="idsc">${d.d}</div></div></div>`;}

function lootKeys(r){const ks=[];if(r.relic)ks.push('relic');if(r.drop)ks.push('drop');if(r.val)ks.push('val');(r.choice||[]).forEach((_,i)=>ks.push('ch'+i));return ks;}
function lootK(r,key){return key.startsWith('ch')?(r.choice||[])[+key.slice(2)]:r[key];}

  return relicRow(k,click,'glow-'+RELICS[k].r,'loot-'+key);

function revealNow(key){const r=UI.rew;if(r&&r.searching===key)r.skip=true;}
async function runReveal(){
  const r=UI.rew;if(!r||r.running)return;r.rev=r.rev||{};
  if(!lootKeys(r).some(k=>!r.rev[k]))return;
  r.running=true;
  for(const key of lootKeys(r)){
    if(UI.rew!==r)break;
    if(r.rev[key])continue;
    const k=lootK(r,key);if(!k){r.rev[key]=true;continue;}
    const dur=(RELICS[k].big?REVEAL_DUR.big:REVEAL_DUR[RELICS[k].r])||600;
    r.searching=key;r.skip=false;render();
    const t0=Date.now();
    while(Date.now()-t0<dur&&!r.skip&&UI.rew===r){sfx('search');await sleep(120);}
    if(UI.rew!==r)break;
    r.searching=null;r.rev[key]=true;render();revealFx(key,k);
    await sleep(RELICS[k].big?1900:RELICS[k].r==='legend'||RELICS[k].r==='val'?900:280);
  }
  r.running=false;
}

// ================= mobile / touch mode =================
// Active on phones (coarse pointer + small screen) and inside the Android app shell (UA contains AbyssApp).
// The page is laid out at a virtual width (meta viewport) so the browser scales everything natively;
// combat gets a compact one-screen layout with peeking cards (tap = raise, tap again = play).
const MOB=(()=>{try{
  if(/AbyssApp/.test(navigator.userAgent))return true;
  if(/[?&]mob=1/.test(location.search))return true;
  const coarse=matchMedia('(pointer:coarse)').matches;
  return coarse&&Math.min(screen.width,screen.height)<600;
}catch(e){return false;}})();
const MOB_VH=470; // virtual height in landscape
const MOB_APP=/AbyssApp/.test(navigator.userAgent);
// aspect of the visible area, measured once before we touch the viewport (browser) or from the screen (app, fullscreen)
const MOB_ASP=(()=>{
  let a=Math.max(screen.width||0,screen.height||0),b=Math.min(screen.width||0,screen.height||0);
  let asp=(a>200&&b>200)?a/b:2.1;
  if(!MOB_APP){const w=innerWidth,h=innerHeight;if(w>200&&h>200){const r=Math.max(w,h)/Math.min(w,h);if(r<asp)asp=r;}}
  return Math.min(2.5,Math.max(1.4,asp));
})();
let MOB_ORI=null;
function mobLand(){try{return matchMedia('(orientation:landscape)').matches;}catch(e){return innerWidth>innerHeight;}}
function mobVP(){
  if(!MOB)return;
  const land=MOB_APP?true:mobLand();
  if(land===MOB_ORI)return;
  MOB_ORI=land;
  let m=document.querySelector('meta[name=viewport]');
  if(!m){m=document.createElement('meta');m.name='viewport';document.head.appendChild(m);}
  const vw=Math.min(1250,Math.max(900,Math.round(MOB_VH*MOB_ASP)));
  const c=land?`width=${vw}, user-scalable=no`:'width=device-width, initial-scale=1, user-scalable=no';
  if(m.content!==c)m.content=c;
  document.body.classList.toggle('mob-port',!land);
}
if(MOB){
  document.body.classList.add('mob');
  mobVP();
  let mobRT=0;const mobRe=()=>{clearTimeout(mobRT);mobRT=setTimeout(()=>{const o=MOB_ORI;mobVP();if(o!==MOB_ORI&&typeof render==='function'&&UI.screen==='combat')render();},300);};
  addEventListener('orientationchange',mobRe);addEventListener('resize',mobRe);
  // portrait hint
  const rm=document.createElement('div');rm.id='rotmsg';
  rm.innerHTML='<div class="rmi">📱↻</div><div class="rmt">请把手机横过来玩</div><div class="rms">横屏时所有内容刚好一屏显示</div>';
  document.body.appendChild(rm);
  // no native long-press menu / text selection
  document.addEventListener('contextmenu',e=>{if(!(typeof INV!=='undefined'&&INV&&INV.sel))e.preventDefault();});
}
// --- long-press tooltip: cancel on move, swallow the click that follows a long press; no hover tips from taps ---
let mobTouch=null,mobTouchT=0,mobLongEnd=0;
if(MOB){
  document.addEventListener('touchstart',e=>{const t=e.touches[0];mobTouch=t?[t.clientX,t.clientY]:null;mobTouchT=Date.now();const tg=e.target;if(tg&&tg.addEventListener){const cl=()=>{if(!tg.isConnected)clearTimeout(touchTipT);};tg.addEventListener('touchend',cl,{once:true});tg.addEventListener('touchcancel',cl,{once:true});}if(TIP.style.display==='block'&&!(e.target.closest&&e.target.closest('#tip')))hideTip();},{passive:true,capture:true});
  document.addEventListener('touchmove',e=>{const t=e.touches[0];if(mobTouch&&t&&Math.hypot(t.clientX-mobTouch[0],t.clientY-mobTouch[1])>10){clearTimeout(touchTipT);mobTouchT=0;}},{passive:true});
  document.addEventListener('touchend',()=>{if(mobTouchT&&Date.now()-mobTouchT>=440&&TIP.style.display==='block')mobLongEnd=Date.now();},{passive:true,capture:true});
  document.addEventListener('click',e=>{if(mobLongEnd&&Date.now()-mobLongEnd<700){e.stopPropagation();e.preventDefault();mobLongEnd=0;}},true);
  document.addEventListener('mouseover',e=>e.stopPropagation(),true);
  document.addEventListener('mousemove',e=>e.stopPropagation(),true);
}
// --- combat: tap to raise, tap again to play ---
function mobNeedsTarget(i){const c=C&&C.hand[i];if(!c)return false;const d=CARDS[c.k];return !!d.tgt&&alive().length>1;}
{const _cc=clickCard;clickCard=function(i){

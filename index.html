<style>
:root{--bg:#120f18;--panel:#1d1828;--panel2:#282137;--text:#ece6f5;--muted:#9a90ad;--gold:#f2c14e;--red:#e5484d;--blue:#4c8dff;--green:#46c37b;--purple:#a77bf3;--line:#3a3250;
--q-c:#5fbf6a;--q-u:#4c8dff;--q-r:#a77bf3;--q-boss:#e8b03a;--q-legend:#ff4d4f;--q-start:#9a90ad}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at top,#241d36,#0d0b12 70%) fixed;color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;font-size:15px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 14px;border-radius:8px;transition:.12s}
button:hover:not(:disabled){border-color:var(--purple);background:#352c49}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:#6646c4;border-color:#8a6be0}
button.primary:hover:not(:disabled){background:#7553d8}
button.danger{background:#6e2230;border-color:#a33a47}
button.gold{background:#7a5b14;border-color:#c99a2e}
button.small{padding:4px 9px;font-size:13px}
#app{max-width:1180px;margin:0 auto;padding:12px 12px 40px}
h1{margin:6px 0 2px;font-size:30px;letter-spacing:2px}
h2{margin:4px 0 10px;font-size:20px}
h3{margin:4px 0 8px;font-size:16px;color:#d9cff0}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.center{text-align:center}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.stat{font-weight:600;white-space:nowrap}
.relicrow{display:flex;flex-wrap:wrap;gap:4px}
.relic{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#2c2540;border:2px solid var(--line);font-size:16px;position:relative;cursor:help}
.relic.in-safe{box-shadow:0 0 0 2px var(--green)}
.relic.in-bag{box-shadow:0 0 0 2px #4c8dff}
.q-c{color:var(--q-c)}.q-u{color:var(--q-u)}.q-r{color:var(--q-r)}.q-boss{color:var(--q-boss)}.q-legend,.q-val{color:var(--q-legend)}.q-start,.q-basic{color:#bbb}.q-x{color:#888}
.bq-c{border-color:var(--q-c)!important}.bq-u{border-color:var(--q-u)!important}.bq-r{border-color:var(--q-r)!important}.bq-boss{border-color:var(--q-boss)!important}.bq-legend,.bq-val{border-color:var(--q-legend)!important}.bq-start{border-color:#777!important}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:#2f2745;color:var(--muted);margin-left:4px;vertical-align:middle}
.tag.g{background:#1d3b2a;color:#7be0a3}.tag.y{background:#3e3216;color:#f2c14e}.tag.r{background:#45202a;color:#ff8b95}.tag.b{background:#1c2d4d;color:#8fb6ff}
/* tooltip */
#tip{position:fixed;z-index:100;pointer-events:none;display:none;max-width:300px;background:#0f0c16f2;border:1px solid #6a5a90;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.5;box-shadow:0 8px 24px #000c}
#tip b{color:#ffd77a}
#tip .kw{margin-top:6px;padding-top:6px;border-top:1px solid #3a3250}
#tip .kw:first-child{margin-top:0;padding-top:0;border-top:0}
#tip .sub{color:var(--muted);font-size:12px}
/* cards */
.cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.card{width:120px;min-height:162px;border-radius:10px;background:linear-gradient(#2d2540,#211b2f);border:2px solid #555;padding:7px 7px 8px;position:relative;cursor:pointer;transition:transform .12s, box-shadow .12s;user-select:none;display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);box-shadow:0 8px 18px #0008}
.card.atk{border-color:#c6474f}.card.skl{border-color:#3f7fe0}.card.pow{border-color:#d7a12e}.card.sts{border-color:#666;background:#1b1820}
.card .cost{position:absolute;top:-9px;left:-9px;width:26px;height:26px;border-radius:50%;background:#14101c;border:2px solid #8a6be0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.card .cname{font-weight:700;font-size:14px;text-align:center;margin:4px 0 2px}
.card .ctype{font-size:11px;text-align:center;color:var(--muted);margin-bottom:6px}
.card .cdesc{font-size:12.5px;line-height:1.4;text-align:center;flex:1;display:flex;align-items:center;justify-content:center}
.card .cdesc b.up{color:#7be07b}.card .cdesc b.down{color:#ff7b7b}
.card.up .cname{color:#7be07b}
.card.unplayable{opacity:.45}
.card.sel{transform:translateY(-16px);box-shadow:0 0 0 3px var(--gold),0 10px 20px #000a}
/* combat */
.field{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;min-height:250px;padding:18px 10px 10px;background:linear-gradient(#1a1525aa,#120f18aa);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;flex-wrap:wrap}
.unit{text-align:center;padding:8px;border-radius:12px;min-width:130px;position:relative;transition:transform .1s}
.unit .uname{font-weight:600;margin:4px 0}
.hpbar{height:12px;background:#3a1418;border-radius:6px;overflow:hidden;position:relative;margin:3px auto;width:130px}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#c0313a,#e5484d)}
.hpbar span{position:absolute;inset:0;font-size:10px;line-height:12px;font-weight:700;text-shadow:0 1px 2px #000}
.block{display:inline-block;background:#1f3d6e;border:1px solid #4c8dff;border-radius:6px;padding:0 6px;font-size:12px;font-weight:700;margin-left:4px;cursor:help}
.sts{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:22px;margin-top:3px}
.sts span{font-size:12px;background:#2a2238;border:1px solid #3a3250;border-radius:5px;padding:1px 5px;cursor:help}
.sts span:hover{border-color:var(--gold)}
.intent{font-weight:700;margin-bottom:4px;min-height:26px;font-size:15px;display:inline-block;padding:1px 8px;border-radius:8px;cursor:help}
.intent:hover{background:#ffffff10}
.intent .atk{color:#ff7b81}.intent .def{color:#7eb0ff}.intent .buf{color:#f2c14e}.intent .deb{color:#c58cff}
.enemies{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;flex:1}
.targeting .enemy.alive{cursor:crosshair;outline:2px dashed #f2c14e66}
.targeting .enemy.alive:hover{outline:2px solid var(--gold);background:#f2c14e15}
.enemy.dead{opacity:.15;pointer-events:none}
.hit{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.float{position:fixed;pointer-events:none;font-weight:800;font-size:22px;text-shadow:0 2px 4px #000;animation:floatup .9s ease-out forwards;z-index:90}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-50px)}}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.energy{width:58px;height:58px;border-radius:50%;background:radial-gradient(#f9b84a,#b8661b);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#2a1600;border:3px solid #ffd27a;box-shadow:0 0 14px #f0a03c88;cursor:help}
.pile{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer}
.log{font-size:12px;color:var(--muted);min-height:18px}
/* map */
#mapwrap{position:relative;height:min(68vh,640px);background:radial-gradient(circle at center,#221b33,#100d17 75%);border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none;cursor:grab}
#mapwrap.dragging{cursor:grabbing}
#mapsvg{width:100%;height:100%;display:block;user-select:none}
.mnode{cursor:default}
.mnode.reach{cursor:pointer}
.mnode.reach .ring{stroke:#f2c14e;stroke-width:3;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.25}}
.mnode.reach:hover .bg{filter:brightness(1.4)}
.mnode.past{opacity:.35}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapleg{position:absolute;left:10px;bottom:10px;background:#0f0c16cc;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.7}
/* inventory */
.inv{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.contbox{background:#16121f;border:1px solid var(--line);border-radius:10px;padding:10px}
.contbox.safe{border-color:#2f6b47}
.grid{position:relative;background:#0e0b14;border-radius:6px;margin-top:6px}
.cell{position:absolute;width:46px;height:46px;border:1px solid #2c2540;background:#1a1524}
.cell.ok{background:#1f5c38}.cell.bad{background:#6a1f28}
.gitem{position:absolute;border:2px solid #777;border-radius:6px;background:#2b2440;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;overflow:hidden;text-align:center}
.gitem:hover{filter:brightness(1.25)}
.gitem small{font-size:10px;line-height:1.1;color:#ddd;padding:0 2px}
.grid.holding .gitem{pointer-events:none;opacity:.55}
.gitem.g-c{background:#1e3324}.gitem.g-u{background:#1b2a47}.gitem.g-r{background:#2e2148}.gitem.g-boss{background:#3d3015}.gitem.g-legend,.gitem.g-val{background:#45181d}
.pool{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:260px;align-content:flex-start;max-height:420px;overflow:auto;padding:2px}
.pitem{display:flex;gap:8px;align-items:center;background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;min-width:150px;position:relative}
.pitem:hover{filter:brightness(1.2)}
.pitem.sel{box-shadow:0 0 0 3px var(--gold)}
.pitem .pe{font-size:22px}
.pitem .pn{font-weight:700;font-size:13px}
.pitem .ps{font-size:11px;color:var(--muted)}
.holdbar{background:#3e3216;border:1px solid #c99a2e;border-radius:8px;padding:6px 10px;font-size:13px;margin-bottom:8px}
/* items */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:9px;cursor:pointer;position:relative}
.item:hover{filter:brightness(1.15)}
.item .ie{font-size:26px;width:34px;text-align:center}
.item .it{font-weight:700;font-size:14px}
.item .idsc{font-size:12.5px;color:#c8bedb;margin-top:2px;line-height:1.35}
/* modal */
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#modal.show{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:1040px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.upg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #2c2540}
.upg:last-child{border-bottom:0}
.pips{color:var(--gold);letter-spacing:2px;font-size:12px}
.big{font-size:44px}
.shopitem{display:flex;flex-direction:column;align-items:center;gap:6px}
.price{color:var(--gold);font-weight:700}
.bigbtn{font-size:17px;padding:12px 22px}
.rules li{margin:4px 0;color:#cfc5e2}
.choice{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel2)}
@media (max-width:640px){.card{width:96px;min-height:140px}.card .cdesc{font-size:11.5px}.unit .face{font-size:48px}.unit.boss .face{font-size:64px}.unit{min-width:100px}.hpbar{width:100px}h1{font-size:24px}}
#fxlayer{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.pt{position:absolute;border-radius:2px;box-shadow:0 0 6px currentColor}
.slash{position:absolute;pointer-events:none;filter:drop-shadow(0 0 6px #fff)}
.flashov{position:absolute;inset:0}
.banner{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);text-align:center;padding:14px 90px;background:linear-gradient(90deg,transparent,#0d0a14ee 22%,#0d0a14ee 78%,transparent);white-space:nowrap}
.banner .bt{font-size:34px;font-weight:900;letter-spacing:6px;text-shadow:0 3px 0 #000,0 0 18px currentColor}
.banner.big .bt{font-size:54px}
.banner .bs{font-size:18px;color:#ddd;margin-top:4px;letter-spacing:3px}
.rays{position:absolute;border-radius:50%;-webkit-mask-image:radial-gradient(circle,#000 15%,transparent 70%);mask-image:radial-gradient(circle,#000 15%,transparent 70%)}
.dmg{position:absolute;font-weight:900;text-shadow:0 3px 0 #000,0 0 8px #000;white-space:nowrap}
#audioctl{position:fixed;right:12px;bottom:12px;z-index:60;display:flex;gap:6px}
.spr{image-rendering:pixelated;display:block;pointer-events:none;-webkit-user-drag:none}
.sprwrap{position:relative;display:inline-block}
.shadow{position:absolute;left:50%;bottom:2px;height:14px;transform:translateX(-50%);background:radial-gradient(ellipse,#000b,transparent 70%);z-index:-1}
.idle.bob{animation:bob 2.2s ease-in-out infinite}
.idle.squash{animation:squash 1.6s ease-in-out infinite;transform-origin:50% 100%}
.idle.hov{animation:floaty 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes squash{0%,100%{transform:scale(1,1)}50%{transform:scale(1.07,.9)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.sprwrap.hit .spr{animation:flashw .28s}
.sprwrap.hit{animation:knock .3s}
#player .sprwrap.phit .spr{animation:flashr .32s}
#player .sprwrap.phit{animation:knockp .3s}
.sprwrap.blocked{animation:knock .2s}
#player .sprwrap.blocked{animation:knockp .2s}
.sprwrap.shine .spr{animation:shine .45s}
@keyframes flashw{0%,40%{filter:brightness(0) invert(1)}100%{filter:none}}
@keyframes flashr{0%,40%{filter:brightness(.7) sepia(1) saturate(9) hue-rotate(-35deg)}100%{filter:none}}
@keyframes shine{0%{filter:brightness(1.9) drop-shadow(0 0 10px #7eb0ff)}100%{filter:none}}
@keyframes knock{0%{transform:translateX(0)}30%{transform:translateX(16px)}100%{transform:translateX(0)}}
@keyframes knockp{0%{transform:translateX(0)}30%{transform:translateX(-16px)}100%{transform:translateX(0)}}
.unit.lunge{animation:lunge .38s ease-in-out both}
@keyframes lunge{0%{transform:translateX(0)}40%{transform:translateX(-70px) scale(1.06)}100%{transform:translateX(0)}}
.unit.dying{animation:dying .7s ease-in forwards;pointer-events:none}
@keyframes dying{0%{opacity:1;filter:none}25%{opacity:1;filter:brightness(3)}100%{opacity:0;transform:translateY(30px) scale(.8);filter:grayscale(1)}}
.unit.gone{visibility:hidden}
.unit.spawn{animation:spawn .6s ease-out backwards}
@keyframes spawn{from{opacity:0;transform:translateX(90px)}}
#player.spawn{animation-name:spawnp}
@keyframes spawnp{from{opacity:0;transform:translateX(-90px)}}
.hand{display:flex;justify-content:center;flex-wrap:nowrap;padding:26px 20px 0;min-height:206px}
.hand .card{transform:translateY(var(--dy)) rotate(var(--rot));transform-origin:50% 130%;box-shadow:0 6px 14px #0009}
.hand .card:hover{transform:translateY(-36px) scale(1.16);z-index:60!important}
.hand .card.sel{transform:translateY(-44px) scale(1.16);z-index:60!important}
.card.deal{animation:deal .4s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes deal{from{opacity:0;transform:translate(-460px,90px) rotate(-50deg) scale(.4)}}
.field.z1{background:linear-gradient(180deg,#1a2233 0%,#141a26 66%,#2a2219 66.5%,#17120d 100%)}
.field.z2{background:linear-gradient(180deg,#24183a 0%,#1a1229 66%,#2b2036 66.5%,#140f1c 100%)}
.field.z3{background:linear-gradient(180deg,#3a1418 0%,#220d12 66%,#3a1c14 66.5%,#160a08 100%)}
.energy.pulse{animation:epulse .35s}
@keyframes epulse{50%{transform:scale(1.2)}}
.item.glow-u{box-shadow:0 0 12px #4c8dff77}
.item.glow-r{box-shadow:0 0 16px #a77bf399}
.item.glow-boss{animation:glowg 1.6s infinite}
.item.glow-legend,.item.glow-val{animation:glowr 1.2s infinite;background:linear-gradient(135deg,#43161c,#282137)}
@keyframes glowr{0%,100%{box-shadow:0 0 18px #ff4d4fbb}50%{box-shadow:0 0 38px #ff4d4f,0 0 10px #ffd23f inset}}
@keyframes glowg{0%,100%{box-shadow:0 0 14px #f2c14e88}50%{box-shadow:0 0 30px #f2c14e}}
.gitem.g-legend,.gitem.g-val{animation:glowr 1.8s infinite}
.item.loot{border-style:dashed;background:#1a1524}
.item.loot.searching{border-color:#f2c14e;border-style:solid}
.sbar{height:7px;background:#100c17;border-radius:4px;margin-top:7px;overflow:hidden;border:1px solid #2c2540}
.sbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f2c14e,#fff3c4);animation:sbar linear forwards}
@keyframes sbar{to{width:100%}}
.popin{animation:popin .45s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes popin{from{opacity:0;transform:scale(.6) translateY(16px)}}
.haul{font-size:40px;font-weight:900;color:#7fd8ff;text-shadow:0 0 18px #7fd8ff88}
@media (max-width:640px){.hand{overflow-x:auto;justify-content:flex-start}.banner .bt{font-size:26px}.banner.big .bt{font-size:36px}}
/* ---- v4: scene, rig, cards ---- */
.field{position:relative;overflow:hidden;min-height:330px;padding:0;display:block;background:#0d0a12}
.scene{position:absolute;inset:0;z-index:0;pointer-events:none}
.scene .sky{position:absolute;inset:0}
.scene .bd{position:absolute;left:0;right:0;bottom:30%;width:100%;height:58%}
.scene .gnd{position:absolute;left:0;right:0;bottom:0;height:31%}
.scene .gnd.over{border-radius:60% 40% 0 0/14px 18px 0 0;box-shadow:0 -2px 8px #ffffff22}
.scene .scv{position:absolute;inset:0;width:100%;height:100%}
.fieldrow{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:22px 16px 10px;min-height:330px}
.uint{min-height:30px}
.uinfo .uname{text-shadow:0 2px 3px #000}
.enemy:not(.alive){pointer-events:none}
.unit.gone{visibility:hidden}
#rig{position:relative;width:210px;height:182px}
#rig .rp{position:absolute;image-rendering:pixelated;display:block}
#rk{position:absolute;left:40px;top:66px;width:108px;height:108px;transition:left .25s,top .25s}
#rkb{position:absolute;inset:0;animation:bob 2.2s ease-in-out infinite}
#rig.k-mounted #rk{opacity:0}
@keyframes gallopidle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#rh{opacity:0;transition:opacity .2s}
#rcavw{position:absolute;inset:0;display:none}
#rig.k-mounted #rcavw{display:block;animation:gallopidle .55s ease-in-out infinite}
#rl{transform-origin:9px 15px;transform:rotate(-70deg)}
#rbar{position:absolute;left:128px;top:58px;height:118px;width:30px;opacity:0;border-right:5px solid #a8d0ff;border-radius:0 70% 70% 0/0 50% 50% 0;background:linear-gradient(90deg,transparent,#7eb0ff44);box-shadow:10px 0 18px -6px #7eb0ff;transform-origin:0 50%;transition:opacity .3s,width .3s;pointer-events:none}
#rig.k-mounted #rbar{left:168px;top:48px;height:128px}
#rig #rb,#rig #rw,#rig #rc{display:none}

#rmove{position:absolute;inset:0}

@keyframes auraP{50%{transform:scale(1.08)}}
.shock{position:absolute;width:60px;height:60px;border-radius:50%;border:4px solid #ffcf5a;box-shadow:0 0 18px #ffcf5a}
.bubble{position:absolute;width:150px;height:150px;border-radius:50%;border:3px solid #7eb0ff;background:radial-gradient(circle,#7eb0ff22,#7eb0ff55);box-shadow:0 0 20px #7eb0ff}
.beam{position:absolute;height:10px;transform-origin:0 50%;background:linear-gradient(90deg,#fff,#ff5a6a 30%,#ff5a6a88);border-radius:6px;box-shadow:0 0 18px #ff5a6a;margin-top:-5px}
.proj{position:absolute;image-rendering:pixelated;filter:drop-shadow(0 0 6px #fff8)}
.minicard{position:absolute;width:34px;height:46px;border-radius:5px;background:#2a2238;border:2px solid #888;font-size:10px;display:flex;align-items:center;justify-content:center;color:#ddd}
/* cards v4 */
.card{width:128px;min-height:184px;padding:6px 7px 8px;border-radius:12px;overflow:hidden;border-width:3px;background:linear-gradient(160deg,#2f2742,#1c1728)}
.card.atk{background:linear-gradient(165deg,#552430 0%,#2a151b 55%,#1d1013 100%)}
.card.skl{background:linear-gradient(165deg,#22365a 0%,#16213a 55%,#10172a 100%)}
.card.pow{background:linear-gradient(165deg,#5a4520 0%,#2c2112 55%,#1f170c 100%)}
.card .cwm{position:absolute;right:-18px;bottom:-22px;width:110px;opacity:.09;image-rendering:pixelated;transform:rotate(-20deg);pointer-events:none}
.card .cart{position:relative;height:60px;margin:4px 0 4px;border-radius:8px;overflow:hidden;border:2px solid #00000066;box-shadow:inset 0 0 10px #000a}
.card.atk .cart{background:radial-gradient(circle at 50% 65%,#ff8a7a55,#3a1419 70%)}
.card.skl .cart{background:radial-gradient(circle at 50% 65%,#7eb0ff55,#14203a 70%)}
.card.pow .cart{background:radial-gradient(circle at 50% 65%,#ffd77a55,#3a2a10 70%)}
.card.sts .cart{background:radial-gradient(circle at 50% 65%,#ffffff22,#1a1820 70%)}
.card.rr-r .cart{border-color:#f2c14ecc;box-shadow:inset 0 0 14px #f2c14e55}
.card.rr-u .cart{border-color:#4c8dffaa}
.card .cart .cai{position:absolute;image-rendering:pixelated;pointer-events:none}
.card .cname{font-size:13.5px;margin:3px 0 0;padding-left:12px;text-shadow:0 1px 2px #000}
.card .ctype{margin-bottom:3px}
.card .cdesc{font-size:12px;line-height:1.38}
.card .cost{top:-4px;left:-4px;width:30px;height:30px;font-size:15px;background:radial-gradient(circle at 35% 35%,#8a6be0,#2a1e50);border:2px solid #d4c4ff;box-shadow:0 0 8px #8a6be088;z-index:2}
.card.atk .cost{background:radial-gradient(circle at 35% 35%,#ff7a7a,#5a1018);border-color:#ffc4c4}
.card.skl .cost{background:radial-gradient(circle at 35% 35%,#7eb0ff,#14306a);border-color:#cfe0ff}
.card.pow .cost{background:radial-gradient(circle at 35% 35%,#ffd77a,#6a4a10);border-color:#fff0c4;color:#2a1a00}
.hand{min-height:214px}
.pmark{animation:floaty 1.6s ease-in-out infinite}
@media (max-width:640px){.card{width:100px;min-height:160px}.card .cart{height:48px}#rig{transform:scale(.75);transform-origin:left bottom}}

.glowfx{position:absolute;width:200px;height:200px;border-radius:50%;pointer-events:none;mix-blend-mode:screen}
#player{position:relative;z-index:3}

#rig.k-wall #rmove{top:-40px}
#rmove{transition:top .3s}
#rw{z-index:2}
.q-uni{color:#6fe3ff}
.card.rr-uni{border-color:#6fe3ff!important;box-shadow:0 0 12px #6fe3ff66}
.card.rr-uni .cart{border-color:#6fe3ffcc;box-shadow:inset 0 0 14px #6fe3ff55}
.upcmp{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
.upcmp .arrow{font-size:34px;color:#7be07b}
.skin{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px;width:200px}
.skin.on{border-color:var(--gold);box-shadow:0 0 14px #f2c14e55}
.skin .pv{display:flex;align-items:flex-end;gap:6px;height:118px}
.skin .pv img{image-rendering:pixelated}
.uniofr{display:flex;flex-direction:column;align-items:center;gap:6px}
/* ===== main menu ===== */
.menu{position:fixed;inset:0;overflow:hidden;z-index:1}
.menu .scene .bd{bottom:22%;height:62%}.menu .scene .gnd{height:23%}
.mshade{position:absolute;inset:0;background:linear-gradient(90deg,#0b0912f2 0%,#0b0912d0 26%,#0b091240 52%,#0b091200 70%),linear-gradient(0deg,#0b0912aa,#0b091200 30%);pointer-events:none}
.mhero{position:absolute;left:62%;bottom:15%;transform:translateX(-50%);pointer-events:none}
.mhorse{image-rendering:pixelated;display:block;animation:mbob 3.2s ease-in-out infinite;filter:drop-shadow(0 10px 0 #0003)}
.mfire{image-rendering:pixelated;position:absolute;left:-70px;bottom:-4px;animation:mfl .5s steps(2) infinite alternate}
.mglow{position:absolute;left:-150px;bottom:-60px;width:240px;height:140px;background:radial-gradient(#ffb04a55,#ffb04a00 70%);animation:mgl 1.6s ease-in-out infinite alternate}
@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes mfl{from{transform:scale(1,1)}to{transform:scale(1.08,.92) translateY(2px)}}
@keyframes mgl{from{opacity:.6}to{opacity:1}}
.mleft{position:absolute;left:clamp(24px,6vw,96px);top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:28px;z-index:2}
.mtitle{font-size:clamp(36px,5vw,58px);font-weight:900;letter-spacing:4px;color:#f6e7c4;text-shadow:0 3px 0 #6b3d14,0 0 24px #f2c14e55;line-height:1.1}
.mtitle small{display:block;font-size:15px;letter-spacing:2px;color:#b9aecb;font-weight:500;text-shadow:none;margin-top:10px}
.mnav{display:flex;flex-direction:column;gap:2px;min-width:260px}
.mi{display:flex;align-items:center;gap:14px;background:none;border:0;border-left:3px solid transparent;border-radius:0;padding:8px 14px 8px 10px;color:#e4dcf1;font-size:19px;text-align:left;transition:transform .15s,color .15s,border-color .15s,background .15s}
.mi .mic{width:26px;text-align:center;font-size:18px;filter:grayscale(.4)}
.mi .mtx{display:flex;flex-direction:column}
.mi small{font-size:12px;color:#8f86a3;margin-top:1px}
.mi:hover:not(:disabled){transform:translateX(8px);color:#ffd977;border-left-color:#f2c14e;background:linear-gradient(90deg,#f2c14e1f,#f2c14e00)}
.mi:hover .mic{filter:none}
.mi.main{font-size:26px;font-weight:800;color:#ffe3a0;margin-bottom:8px}
.mi.main small{font-size:13px;font-weight:500}
.mi:disabled{opacity:.4}
.mnew{background:#e5484d;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;margin-left:4px;animation:pulse2 1.4s ease-in-out infinite}
@keyframes pulse2{50%{opacity:.55}}
.msep{height:1px;background:linear-gradient(90deg,#ffffff22,#ffffff00);margin:8px 0}
.mtop{position:absolute;right:16px;top:14px;display:flex;gap:8px;z-index:2}
.mpill{background:#0d0b14b3;border:1px solid #ffffff1f;border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;backdrop-filter:blur(4px)}
.mfoot{position:absolute;left:clamp(24px,6vw,96px);bottom:14px;color:#8f86a3;font-size:12px;z-index:2;display:flex;gap:12px}
.mver{color:#5d566d}
.mpanel{position:fixed;inset:0;z-index:30;background:#07060bcc;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;animation:mfade .18s ease-out}
@keyframes mfade{from{opacity:0}}
.mbox{background:linear-gradient(#211b2e,#17131f);border:1px solid #4a3f62;border-radius:16px;box-shadow:0 20px 60px #000c,inset 0 1px 0 #ffffff14;width:min(820px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;animation:mpop .2s ease-out}
.mbox.wide{width:min(1120px,100%)}
@keyframes mpop{from{transform:translateY(10px) scale(.98);opacity:0}}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #3a3250}
.mhead h2{margin:0;flex:1;font-size:20px}
.mx{background:none;border:0;font-size:18px;color:#9a90ad;padding:4px 10px}.mx:hover{color:#fff}
.mbody{overflow:auto;padding:14px 18px 18px}
.mbody>.panel{background:none;border:0;padding:0;margin:0}
.mnote{font-size:13px;margin:0 0 10px}
.cards.codex{justify-content:flex-start}
.relgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}
/* news */
.news{display:flex;gap:18px;align-items:flex-start}
.nlist{display:flex;flex-direction:column;gap:4px;width:220px;flex-shrink:0;position:sticky;top:0}
.nli{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#ffffff08;border:1px solid transparent;padding:8px 10px}
.nli small{color:#9a90ad;font-size:12px;line-height:1.35}
.nli.on{border-color:#f2c14e88;background:#f2c14e14}
.nli .ntag{margin-bottom:2px}
.ntag{display:inline-block;font-size:11px;font-weight:700;color:#1d1828;background:#f2c14e;border-radius:4px;padding:1px 6px}
.nart{flex:1;min-width:0;line-height:1.65}
.nart h2{margin:6px 0 4px;font-size:24px}
.nart h3{margin:22px 0 8px;font-size:17px;color:#ffd977;border-bottom:1px solid #3a3250;padding-bottom:4px}
.nart ul{padding-left:20px;margin:6px 0}.nart li{margin:4px 0;color:#d8cfe8}
.nmeta{color:#9a90ad;font-size:13px}
.nlead{color:#cfc5e2;font-size:15px}
.nb{color:#8f86a3;text-decoration:line-through;text-decoration-color:#8f86a399}
.ntw{overflow-x:auto}
.ntab{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.ntab th{text-align:left;color:#9a90ad;font-weight:600;border-bottom:1px solid #4a3f62;padding:6px 8px;white-space:nowrap}
.ntab td{border-bottom:1px solid #2c2540;padding:6px 8px;vertical-align:top}
.ntab td b{color:#ffd977}
.nart details{margin:10px 0;background:#ffffff06;border:1px solid #2c2540;border-radius:10px;padding:8px 12px}
.nart summary{cursor:pointer;font-weight:700;color:#cfc5e2}
.nchart{background:#ffffff06;border:1px solid #2c2540;border-radius:12px;padding:12px 14px;margin:10px 0}
.nct{font-size:13px;color:#9a90ad}
.nleg{display:flex;gap:6px;align-items:center;font-size:12px;color:#9a90ad;margin:6px 0 4px}
.nleg i{position:static;display:inline-block;margin-left:8px}
.nca{font-weight:700;margin:10px 0 2px;font-size:14px}
.ncr{display:flex;align-items:center;gap:10px;height:24px}
.ncl{width:52px;font-size:12px;color:#9a90ad;padding-left:12px}
.nctr{flex:1;position:relative;height:100%}
.ncg{position:absolute;left:0;right:0;top:50%;height:1px;background:#ffffff14}
.ncbar{position:absolute;top:calc(50% - 2px);height:4px;background:#8f86a366;border-radius:2px}
.nchart i,.nleg i{width:10px;height:10px;border-radius:50%}
.nctr i{position:absolute;top:50%;transform:translate(-50%,-50%);cursor:help}
i.d0{background:#8f86a3}i.d1{background:#f2c14e;width:13px;height:13px;box-shadow:0 0 0 2px #17131f}
.ncv{width:92px;font-size:12px;text-align:right;white-space:nowrap}.ncv b{color:#ffd977}
.ncax{display:flex;justify-content:space-between;margin-left:62px;margin-right:102px;font-size:11px;color:#6d6580;margin-top:4px}
.narch{background:#ffffff06;border:1px solid #2c2540;border-radius:12px;padding:10px 14px;margin:10px 0}
.narch p{margin:4px 0 8px;color:#cfc5e2;font-size:14px}
.nah{font-size:15px}
.ndr{display:flex;gap:10px;margin:6px 0;align-items:flex-start}
.ndl{width:92px;flex-shrink:0;font-size:12px;color:#9a90ad;padding-top:3px}
.ndk{display:inline-block;font-size:12px;padding:2px 7px;margin:2px 3px 2px 0;border-radius:6px;background:#2c2540;border:1px solid #3a3250;cursor:help}
.ndk.rr-u{border-color:#4c8dff88}.ndk.rr-r{border-color:#f2c14e99}.ndk.rr-uni{border-color:#6fe3ffaa}
@media (max-width:760px){.mhero{left:72%;opacity:.5}.news{flex-direction:column}.nlist{width:100%;position:static;flex-direction:row;overflow-x:auto}.nli{min-width:150px}}
.mbody[data-p=skin]>.panel h2{display:none}.mbody[data-p=skin]>.panel>.row{justify-content:flex-start}
/* cape flutter */
.cape{position:absolute;image-rendering:pixelated;background-repeat:no-repeat;background-position:0 0;animation:capef .54s step-end infinite;pointer-events:none}
@keyframes capef{0%{background-position-x:0}33.33%{background-position-x:calc(var(--fw) * -1)}66.66%{background-position-x:calc(var(--fw) * -2)}}
#rig.k-mounted .cape,.kfig.mhorse .cape{animation-duration:.33s}
.kfig{position:relative;display:inline-block;vertical-align:bottom}
.kfig img{position:relative;display:block;image-rendering:pixelated}
.spark{position:absolute;height:3px;border-radius:2px;transform-origin:0 50%;pointer-events:none}
.fxring{position:absolute;border:3px solid;border-radius:50%;pointer-events:none}
.arc{position:absolute;border-radius:50%;pointer-events:none;-webkit-mask:radial-gradient(circle,transparent 58%,#000 62%,#000 72%,transparent 76%);mask:radial-gradient(circle,transparent 58%,#000 62%,#000 72%,transparent 76%)}
.ghost{position:absolute;background-size:100% 100%;image-rendering:pixelated;pointer-events:none}
/* score */
.scorep{border-color:#6a5a90;background:linear-gradient(#251e35,#1d1828)}
.srows{margin-top:8px}
.srow{display:grid;grid-template-columns:150px 1fr 80px;gap:10px;padding:6px 4px;border-bottom:1px solid #2c2540;opacity:0;animation:srin .35s ease-out forwards}
.srow .sd{color:#9a90ad;font-size:13px}.srow .sp{text-align:right;font-weight:800;color:#ffd977;font-variant-numeric:tabular-nums}
.srow.sub{background:#ffffff08;border-radius:6px}.srow.sub .sp{color:#fff}
@keyframes srin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.stotal{display:flex;align-items:baseline;justify-content:center;gap:14px;margin:14px 0 4px}
.stotal span{color:#9a90ad;font-size:16px}.stotal b{font-size:52px;font-weight:900;color:#ffd977;text-shadow:0 3px 0 #6b3d14,0 0 26px #f2c14e66;font-variant-numeric:tabular-nums}
.sconv{text-align:center;font-size:14px}
.newrec{background:linear-gradient(90deg,#f2c14e,#ff8a2a);color:#1d1828;font-weight:900;border-radius:999px;padding:3px 12px;animation:pulse2 1.2s infinite}
/* badges */
.badge{--c1:#c8834a;--c2:#7a4a22;position:relative;width:var(--s);height:calc(var(--s)*1.18);display:inline-block;flex-shrink:0}
.badge.t-bronze{--c1:#e09a5c;--c2:#8a4f22}.badge.t-silver{--c1:#e4ebf5;--c2:#8790a3}.badge.t-gold{--c1:#ffd45a;--c2:#b07a12}.badge.t-plat{--c1:#9ff0ff;--c2:#4a8fd6}
.badge.t-easy{--c1:#7be07b;--c2:#2f8a46}.badge.t-normal{--c1:#ffd45a;--c2:#4c6fd8}.badge.t-hard{--c1:#ff6b5a;--c2:#8a1f1f}.badge.t-lock{--c1:#4a4258;--c2:#2a2434}
.bring{position:relative;z-index:1;width:var(--s);height:var(--s);border-radius:50%;padding:calc(var(--s)*.085);background:conic-gradient(var(--c1),var(--c2),var(--c1),var(--c2),var(--c1),var(--c2),var(--c1));box-shadow:0 3px 0 #0007,0 0 16px color-mix(in srgb,var(--c1) 40%,transparent)}
.bring::before{content:'';position:absolute;inset:calc(var(--s)*.035);border-radius:50%;border:1px dashed #ffffff44;pointer-events:none}
.bcore{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ffffff2a,transparent 45%),radial-gradient(#332a45,#15111d);display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.4);box-shadow:inset 0 0 0 2px #0006,inset 0 -4px 8px #0008}
.bcore.num{font-weight:900;color:var(--c1);font-size:calc(var(--s)*.42);text-shadow:0 2px 0 #000a,0 0 10px color-mix(in srgb,var(--c1) 50%,transparent);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.brib{position:absolute;z-index:0;left:50%;top:calc(var(--s)*.62);transform:translateX(-50%);width:calc(var(--s)*.56);height:calc(var(--s)*.56)}
.brib::before,.brib::after{content:'';position:absolute;top:0;width:46%;height:100%;background:var(--c2);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.brib::before{left:0;transform:rotate(14deg)}.brib::after{right:0;transform:rotate(-14deg)}
.bgrade{position:absolute;z-index:2;left:50%;bottom:calc(var(--s)*.02);transform:translateX(-50%);background:var(--c2);color:#fff;font-size:calc(var(--s)*.15);font-weight:800;padding:1px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 0 #0008}
.badge.t-lock .bcore{color:#6d6580;font-weight:900;font-size:calc(var(--s)*.36)}
.achsum{display:flex;align-items:center;gap:12px;margin-bottom:6px}.achsum span{white-space:nowrap;color:#9a90ad}.achsum b{color:#ffd977}
.achbar{flex:1;height:8px;border-radius:4px;background:#2c2540;overflow:hidden}.achbar i{display:block;height:100%;background:linear-gradient(90deg,#f2c14e,#ff8a2a)}
.achg{margin:16px 0 8px;font-size:16px;color:#ffd977}.achg small{font-weight:400;color:#9a90ad;font-size:12px;margin-left:10px}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.achc{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px 8px;border-radius:12px;background:#ffffff05;border:1px solid #2c2540}
.achc.on{background:linear-gradient(#ffffff0c,#ffffff03);border-color:#4a3f62}
.achc b{margin-top:4px}.achc span{font-size:12px;color:#9a90ad;line-height:1.4}.achc small{font-size:11px;color:#6d6580}
.achc:not(.on) b{color:#8f86a3}
.achtoast{position:fixed;left:50%;top:18px;z-index:200;display:flex;align-items:center;gap:12px;background:linear-gradient(#2a2238,#1d1828);border:1px solid #f2c14e88;border-radius:14px;padding:10px 18px 10px 12px;box-shadow:0 10px 30px #000a,0 0 24px #f2c14e33;pointer-events:none}
.achtoast .atk{font-size:12px;color:#f2c14e;font-weight:700}.achtoast b{font-size:16px}.achtoast .atd{font-size:12px;color:#9a90ad}
/* tech tree */
.tech{display:flex;gap:16px;align-items:stretch}
.ttree{position:relative;flex:1;min-height:420px;border-radius:14px;background:radial-gradient(ellipse at 50% 0%,#3a2e5a55,transparent 60%),repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 28px),repeating-linear-gradient(90deg,#ffffff05 0 1px,transparent 1px 28px),#120e1a;border:1px solid #3a3250;overflow:hidden}
.tlines{position:absolute;inset:0;width:100%;height:100%}
.tlines line{stroke:#3a3250;stroke-width:4;stroke-linecap:round}
.tlines line.lit{stroke:#f2c14e;filter:drop-shadow(0 0 6px #f2c14e);stroke-dasharray:10 8;animation:tflow 1s linear infinite}
@keyframes tflow{to{stroke-dashoffset:-18}}

function buildCav(HR){
  const rider=[
  ".......rrr............",
  "......rrr.............",
  ".....sssss............",
  "....sssssss...........",
  "....ssskkkks..........",
  "....sssWkWks..........",
  "....ssskkkks..........",
  ".....sssssss..........",
  "...BBBbbbbbb..........",
  "..BBbBbbybbbf.........",
  "..BByBbyyybb..........",
  "..BBbBbbbybb.........."];
  const H=HR,W=22,off=6,g=[];
  for(let y=0;y<off+H.length;y++){let row=Array(W).fill('.');const hr=y-off;if(hr>=0)row=(H[hr]+'.'.repeat(W)).slice(0,W).split('');if(y<rider.length)(rider[y]+'.'.repeat(W)).slice(0,W).split('').forEach((c,x)=>{if(c!=='.')row[x]=c;});g.push(row);}
  [[8,13],[9,13],[8,14],[9,14],[8,15],[9,15]].forEach(([x,y])=>g[y][x]='S');[[8,16],[9,16]].forEach(([x,y])=>g[y][x]='X');
  return g.map(r=>r.join(''));
}

const AU={ctx:null,master:null,musicGain:null,last:{},musicOn:false,nodes:[],timer:null};
function svol(){const v=settings().svol;return v==null?1:v;}
function settings(){if(!M)return {sfx:true,music:true};M.settings=M.settings||{sfx:true,music:true};return M.settings;}
function auOK(){
  if(!AU.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;try{AU.ctx=new AC();}catch(e){return null;}AU.master=AU.ctx.createGain();AU.master.gain.value=0.55;AU.master.connect(AU.ctx.destination);AU.sfx=AU.ctx.createGain();AU.sfx.gain.value=svol();AU.sfx.connect(AU.master);}
  if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});
  return AU.ctx;
}
function osc(type,f1,f2,dur,vol,delay=0,dest){const c=AU.ctx;const t=c.currentTime+delay;const o=c.createOscillator();const g=c.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);if(f2&&f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest||AU.sfx||AU.master);o.start(t);o.stop(t+dur+0.05);}
let NOISEBUF=null;
function noise(dur,vol,ftype,f1,f2,q=1,delay=0){const c=AU.ctx;if(!NOISEBUF){NOISEBUF=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=NOISEBUF.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const t=c.currentTime+delay;const s=c.createBufferSource();s.buffer=NOISEBUF;s.loop=true;const fl=c.createBiquadFilter();fl.type=ftype;fl.Q.value=q;fl.frequency.setValueAtTime(f1,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(AU.sfx||AU.master);s.start(t);s.stop(t+dur+0.05);}

function sfx(name){if(!settings().sfx)return;if(!auOK())return;const now=performance.now();if(AU.last[name]&&now-AU.last[name]<45)return;AU.last[name]=now;try{SND[name]&&SND[name]();}catch(e){}}
function musicStart(){
  if(AU.musicOn||!settings().music)return;const c=auOK();if(!c)return;
  AU.musicOn=true;
  const g=c.createGain();g.gain.setValueAtTime(0.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(0.05,c.currentTime+3);g.connect(AU.master);AU.musicGain=g;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;lp.connect(g);
  [55,82.4,110.3].forEach((f,i)=>{const o=c.createOscillator();o.type=i===2?'triangle':'sawtooth';o.frequency.value=f;const og=c.createGain();og.gain.value=i===2?0.5:0.22;o.connect(og);og.connect(lp);o.start();AU.nodes.push(o);});

  const scale=[220,261.6,293.7,329.6,392,440,523.3];

}

const NOTE_PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function midiOf(s){const m=/^([A-G])([#b]?)(-?\d)$/.exec(s);if(!m)return null;return 12*(+m[3]+1)+NOTE_PC[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);}
function hz(m){return 440*Math.pow(2,(m-69)/12);}
function chordNotes(name,oct=3){const m=/^([A-G][#b]?)(m?)/.exec(name);const r=midiOf(m[1]+oct);return [r,r+(m[2]?3:4),r+7];}

// precompile lead strings → per-step events
for(const k in BGM){const t=BGM[k];t.ch=t.chords.split(' ');t.bars=t.ch.length;const toks=t.lead.replace(/\|/g,' ').split(/\s+/).filter(Boolean);
  t.ev=[];for(let i=0;i<toks.length;i++){const s=toks[i];if(s==='.'||s==='r')continue;let len=1;while(i+len<toks.length&&toks[i+len]==='.'&&len<12)len++;t.ev[i]={m:midiOf(s),len};}}
const BG={cur:null,next:null,gain:null,step:0,t0:0,iv:null,want:null};
function mvol(){const v=settings().mvol;return v==null?0.6:v;}
function bgmNode(){const c=AU.ctx;const g=c.createGain();g.gain.value=0.0001;g.connect(AU.master);return g;}
function bTone(dest,type,f,t,dur,vol,att=.008,rel=.08){const c=AU.ctx;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+att);g.gain.setValueAtTime(vol,t+Math.max(att,dur-rel));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);return o;}
function bNoise(dest,t,dur,vol,type,f){const c=AU.ctx;if(!NOISEBUF){noise(0.01,0.0001,'lowpass',100);}const s=c.createBufferSource();s.buffer=NOISEBUF;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(dest);s.start(t,Math.random()*.5);s.stop(t+dur+.02);}
function bgmStep(tr,i,t,dest){
  const sd=60/tr.bpm/4;const bar=Math.floor(i/16)%tr.bars,s=i%16;const loop=Math.floor(i/(tr.bars*16));const fast=tr.bpm>=130;const brk=fast&&loop%3===2;const alt=!fast&&loop%2===1;const ch=chordNotes(tr.ch[bar]);const V=tr.vol||.8;
  // lead
  const e=brk&&bar<4?null:tr.ev[(bar*16+s)];if(e){const lead=dest.lead;bTone(lead,alt?'sine':tr.wave,hz(e.m),t,e.len*sd*.95,(alt?.13:.11)*V,.01,.06);if(alt)bTone(lead,'triangle',hz(e.m-12),t,e.len*sd*.9,.05*V,.02,.08);if(e.len>=4)bTone(lead,'sine',hz(e.m)*2,t,e.len*sd*.9,.025*V,.02,.1);}
  // bass
  const b=tr.bass[s];if(b&&b!=='.'){const off={R:0,'3':ch[1]-ch[0],'5':7,'8':12}[b]||0;bTone(dest.bass,tr.bassW,hz(ch[0]-12+off),t,sd*(tr.bpm>120?1.6:3.2),.16*V,.01,.05);}
  // pad: one chord per bar
  if(s===0&&tr.pad){ch.forEach((m,j)=>{bTone(dest.pad,'sawtooth',hz(m+12),t,sd*16,.018*tr.pad*V,.35,.5);bTone(dest.pad,'sawtooth',hz(m+12)*1.004,t,sd*16,.014*tr.pad*V,.35,.5);});}
  // arp
  if(tr.arp){const a=tr.arp[s];if(a&&a!=='.'){bTone(dest.lead,'square',hz(ch[+a]+24),t,sd*1.2,.03*V,.005,.05);}}
  // drums
  const d=dest.drum;
  if(tr.k&&tr.k[s]==='x'&&!(brk&&bar<4&&s%8)){const c=AU.ctx;const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.18);g.gain.setValueAtTime(.42*V,t);g.gain.exponentialRampToValueAtTime(0.0001,t+.24);o.connect(g);g.connect(d);o.start(t);o.stop(t+.26);}
  if(tr.s&&tr.s[s]==='x'){bNoise(d,t,.13,.16*V,'bandpass',1900);bTone(d,'triangle',190,t,.08,.08*V,.002,.04);}
  if(tr.h&&tr.h[s]==='x'){bNoise(d,t,.035,(s%4===0?.07:.04)*V,'highpass',7500);}
  if(tr.crash&&s===0&&bar%4===0)bNoise(d,t,1.1,.06*V,'highpass',5000);
}
function bgmBus(){const c=AU.ctx;const out=bgmNode();const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;lp.connect(out);
  const lead=c.createGain();lead.gain.value=1;lead.connect(lp);const bass=c.createBiquadFilter();bass.type='lowpass';bass.frequency.value=700;bass.connect(out);
  const pad=c.createBiquadFilter();pad.type='lowpass';pad.frequency.value=1100;pad.connect(out);const drum=c.createGain();drum.gain.value=1;drum.connect(out);return {out,lead,bass,pad,drum};}
function bgmPlay(name){
  if(!AU.ctx||!BGM[name])return;if(BG.name===name)return;const c=AU.ctx;const now=c.currentTime;
  if(BG.bus){const old=BG.bus.out;old.gain.cancelScheduledValues(now);old.gain.setValueAtTime(Math.max(0.0001,old.gain.value),now);old.gain.exponentialRampToValueAtTime(0.0001,now+.9);setTimeout(()=>{try{old.disconnect();}catch(e){}},1400);}
  BG.name=name;BG.tr=BGM[name];BG.bus=bgmBus();BG.step=0;BG.next=now+.12;
  BG.bus.out.gain.setValueAtTime(0.0001,now);BG.bus.out.gain.exponentialRampToValueAtTime(0.0001+1.1*mvol(),now+1.2);
  if(!BG.iv)BG.iv=setInterval(bgmTick,30);
}
function bgmTick(){
  if(!AU.ctx||!BG.tr||!AU.musicOn)return;const c=AU.ctx;const tr=BG.tr;const sd=60/tr.bpm/4;
  if(BG.next<c.currentTime-.5)BG.next=c.currentTime+.05; // tab was asleep: don't burst-play the backlog
  while(BG.next<c.currentTime+.15){try{bgmStep(tr,BG.step,BG.next,BG.bus);}catch(e){}BG.step=(BG.step+1)%(tr.bars*16*6);BG.next+=sd;}
}
function musicScene(){
  const s=UI&&UI.screen;
  if(s==='combat'&&C){if(C.kind==='boss')return 'boss';if(C.kind==='elite')return 'elite';return 'battle';}
  if(s==='shop'||s==='unishop')return 'shop';
  if(s==='rest')return 'rest';
  if(s==='event')return 'event';
  if(s==='map'||s==='crossroad'||s==='exitnode'||s==='reward')return 'map';
  return 'base';
}
function bgmSync(){if(!AU.musicOn||!AU.ctx)return;const n=musicScene();if(n!==BG.name)bgmPlay(n);}
musicStart=function(){if(AU.musicOn||!settings().music)return;const c=auOK();if(!c)return;AU.musicOn=true;BG.name=null;bgmSync();};
musicStop=function(){AU.musicOn=false;if(BG.bus){const g=BG.bus.out;try{g.gain.cancelScheduledValues(AU.ctx.currentTime);g.gain.setValueAtTime(0.0001,AU.ctx.currentTime);setTimeout(()=>{try{g.disconnect();}catch(e){}},200);}catch(e){}}BG.bus=null;BG.name=null;BG.tr=null;};
function setMVol(v){settings().mvol=Math.max(0,Math.min(1,v/100));if(BG.bus&&AU.ctx){const g=BG.bus.out.gain;g.cancelScheduledValues(AU.ctx.currentTime);g.setValueAtTime(0.0001+1.1*mvol(),AU.ctx.currentTime);}save();}
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend().catch(()=>{});else AU.ctx.resume().catch(()=>{});});

function setSVol(v){settings().svol=Math.max(0,Math.min(1,v/100));if(AU.sfx&&AU.ctx){AU.sfx.gain.cancelScheduledValues(0);AU.sfx.gain.value=svol();}save();}

// ================= visual fx =================
const FXE=[];
function fxLayer(){return document.getElementById('fxlayer');}
function centerOf(el){const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];}
function burst(x,y,color,n=10,spread=70,size=6){
  const L=fxLayer();
  for(let i=0;i<n;i++){
    const d=document.createElement('div');d.className='pt';const s=size*(0.5+Math.random());
    d.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${color}`;
    L.appendChild(d);
    const a=Math.random()*Math.PI*2,r=spread*(0.4+Math.random()*0.8);
    const anim=d.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*r}px),calc(-50% + ${Math.sin(a)*r+20}px)) scale(.2)`,opacity:0}],{duration:450+Math.random()*350,easing:'cubic-bezier(.2,.7,.4,1)'});
    anim.onfinish=()=>d.remove();setTimeout(()=>d.remove(),1000);
  }
}
function fxCol(){const sk=typeof curSkin==='function'?curSkin():null;return (sk&&sk.fx)||'#bfe6ff';}
function fxEl(cls,css,html=''){const d=document.createElement('div');d.className=cls;d.style.cssText=css;d.innerHTML=html;fxLayer().appendChild(d);return d;}
function fxAnim(d,kf,opt){const a=d.animate(kf,opt);a.onfinish=()=>d.remove();setTimeout(()=>d.remove(),(opt.duration||400)+(opt.delay||0)+400);return a;}
// layered blade slash: coloured glow + white core; big hits cross a second slash, huge hits add a ring + flash
function slashFx(x,y,big,huge){
  const col=fxCol();const sz=huge?250:big?185:135;const rot=-35+Math.random()*30;
  const one=(r,delay,w)=>{const d=fxEl('slash',`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;filter:drop-shadow(0 0 7px ${col}) drop-shadow(0 0 2px #fff)`,
    `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M4 82 Q 50 36 96 14" stroke="${col}" stroke-width="${w+7}" fill="none" stroke-linecap="round" opacity=".5"/><path d="M8 78 Q 50 40 92 18" stroke="#fff" stroke-width="${w}" fill="none" stroke-linecap="round"/></svg>`);
    fxAnim(d,[{transform:`translate(-50%,-50%) rotate(${r}deg) scale(.3,.6)`,opacity:1},{transform:`translate(-50%,-50%) rotate(${r}deg) scale(1.1,1)`,opacity:1,offset:.35},{transform:`translate(-50%,-50%) rotate(${r}deg) scale(1.3,.4)`,opacity:0}],{duration:320,delay,easing:'ease-out',fill:'backwards'});};
  one(rot,0,7);
  if(big)one(rot+95,70,6);
  impactStar(x,y,col,huge?16:big?11:7,huge?120:big?90:60);
  if(huge){ring(x,y,col,70);ring(x,y,'#ffffff',40,90);flash(col+'55',260,false);}
}
function impactStar(x,y,col,n=8,len=80){
  for(let i=0;i<n;i++){const a=(i/n)*360+Math.random()*20;const l=len*(0.6+Math.random()*0.6);
    const d=fxEl('spark',`left:${x}px;top:${y}px;width:${l}px;background:linear-gradient(90deg,#fff,${col} 40%,transparent);box-shadow:0 0 6px ${col}`);
    fxAnim(d,[{transform:`translate(0,-50%) rotate(${a}deg) translateX(6px) scaleX(.2)`,opacity:1},{transform:`translate(0,-50%) rotate(${a}deg) translateX(${l*0.5}px) scaleX(1)`,opacity:.9,offset:.4},{transform:`translate(0,-50%) rotate(${a}deg) translateX(${l}px) scaleX(.1)`,opacity:0}],{duration:360+Math.random()*120,easing:'ease-out'});}
}
function ring(x,y,col,size=60,delay=0){const d=fxEl('fxring',`left:${x}px;top:${y}px;width:${size}px;height:${size}px;border-color:${col};box-shadow:0 0 14px ${col},inset 0 0 10px ${col}`);
  fxAnim(d,[{transform:'translate(-50%,-50%) scale(.2)',opacity:1},{transform:'translate(-50%,-50%) scale(3.2)',opacity:0}],{duration:480,delay,easing:'cubic-bezier(.2,.8,.3,1)',fill:'backwards'});}
// sword arc: a crescent of light swept around the knight's blade
function arcTrail(el,from,sweep,r=90,dur=260,col){
  if(!el)return;col=col||fxCol();const [x,y]=centerOf(el);
  const d=fxEl('arc',`left:${x}px;top:${y}px;width:${r*2}px;height:${r*2}px;background:conic-gradient(from ${from}deg,transparent 0deg,${col}00 2deg,${col}cc ${sweep*0.75}deg,#ffffff ${sweep-4}deg,transparent ${sweep}deg);filter:drop-shadow(0 0 6px ${col})`);
  fxAnim(d,[{transform:'translate(-50%,-50%) rotate(-25deg) scale(.85)',opacity:0},{transform:'translate(-50%,-50%) rotate(0deg) scale(1)',opacity:1,offset:.35},{transform:'translate(-50%,-50%) rotate(12deg) scale(1.08)',opacity:0}],{duration:dur,easing:'ease-out'});
}
// ghost copies trailing a moving sprite (cavalry charge)
function afterimages(el,dur=420,every=40){
  if(!el)return;const col=fxCol();let t=0;
  const iv=setInterval(()=>{t+=every;if(t>dur||!document.body.contains(el)){clearInterval(iv);return;}
    const r=el.getBoundingClientRect();if(!r.width)return;
    const d=fxEl('ghost',`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;background-image:url(${el.src});filter:drop-shadow(0 0 4px ${col}) brightness(1.6) saturate(.4)`);
    fxAnim(d,[{opacity:.55},{opacity:0}],{duration:260,easing:'ease-out'});},every);
}
function speedLines(y,h=120,col){col=col||fxCol();const W=innerWidth;
  for(let i=0;i<10;i++){const yy=y-h/2+Math.random()*h;const l=120+Math.random()*220;
    const d=fxEl('spark',`left:${-l}px;top:${yy}px;width:${l}px;height:${2+Math.random()*2}px;background:linear-gradient(90deg,transparent,${col},#fff)`);
    fxAnim(d,[{transform:'translateX(0)',opacity:.9},{transform:`translateX(${W+l}px)`,opacity:.2}],{duration:380+Math.random()*200,delay:Math.random()*160,easing:'ease-in',fill:'backwards'});}
}
function groundSlam(x,y,col){col=col||fxCol();
  const d=fxEl('fxring',`left:${x}px;top:${y}px;width:120px;height:120px;border-width:6px;border-color:${col};box-shadow:0 0 18px ${col}`);
  fxAnim(d,[{transform:'translate(-50%,-50%) scale(.2,.06)',opacity:1},{transform:'translate(-50%,-50%) scale(3.4,.9)',opacity:0}],{duration:520,easing:'ease-out'});
  burst(x,y,'#c8b08a',16,110,7);burst(x,y-10,col,12,90,5);rays(x,y-30,col+'77',600,300);
}
function shake(px=6,dur=260){const el=document.getElementById('app');if(!el||!el.animate)return;const k=[];for(let i=0;i<6;i++)k.push({transform:`translate(${(Math.random()-.5)*px*2}px,${(Math.random()-.5)*px}px)`});k.push({transform:'translate(0,0)'});el.animate(k,{duration:dur});}
function flash(color='rgba(255,40,40,.35)',dur=380,inset=true){const d=document.createElement('div');d.className='flashov';d.style.cssText=inset?`box-shadow:inset 0 0 160px 40px ${color}`:`background:${color}`;fxLayer().appendChild(d);const a=d.animate([{opacity:1},{opacity:0}],{duration:dur,easing:'ease-out'});a.onfinish=()=>d.remove();setTimeout(()=>d.remove(),dur+200);}
function banner(text,color='#f2c14e',sub='',dur=900,big=false){
  const d=document.createElement('div');d.className='banner'+(big?' big':'');d.innerHTML=`<div class="bt" style="color:${color}">${text}</div>${sub?`<div class="bs">${sub}</div>`:''}`;fxLayer().appendChild(d);
  const a=d.animate([{opacity:0,transform:'translate(-50%,-50%) scaleX(.6)'},{opacity:1,transform:'translate(-50%,-50%) scaleX(1)',offset:.15},{opacity:1,transform:'translate(-50%,-50%) scaleX(1)',offset:.8},{opacity:0,transform:'translate(-50%,-50%) scaleX(1.1)'}],{duration:dur,easing:'ease-out'});
  a.onfinish=()=>d.remove();setTimeout(()=>d.remove(),dur+200);
}
function rays(x,y,color,dur=1600,size=360){const d=document.createElement('div');d.className='rays';d.style.cssText=`left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:repeating-conic-gradient(from 0deg,${color} 0deg 10deg,transparent 10deg 30deg)`;fxLayer().appendChild(d);const a=d.animate([{opacity:0,transform:'translate(-50%,-50%) rotate(0deg) scale(.4)'},{opacity:.85,transform:'translate(-50%,-50%) rotate(60deg) scale(1)',offset:.25},{opacity:0,transform:'translate(-50%,-50%) rotate(180deg) scale(1.2)'}],{duration:dur,easing:'ease-out'});a.onfinish=()=>d.remove();setTimeout(()=>d.remove(),dur+200);}
function popText(x,y,txt,col,size=24){const d=document.createElement('div');d.className='dmg';d.textContent=txt;d.style.cssText=`left:${x}px;top:${y}px;color:${col};font-size:${size}px`;fxLayer().appendChild(d);const dx=(Math.random()-.5)*40;const a=d.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:0},{transform:'translate(-50%,-70%) scale(1.35)',opacity:1,offset:.18},{transform:`translate(calc(-50% + ${dx}px),-120%) scale(1)`,opacity:1,offset:.55},{transform:`translate(calc(-50% + ${dx}px),-260%) scale(.9)`,opacity:0}],{duration:950,easing:'ease-out'});a.onfinish=()=>d.remove();setTimeout(()=>d.remove(),1200);}
function restartClass(el,cls){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
function processFXE(){
  const evs=FXE.splice(0);
  for(const ev of evs){
    if(ev.t==='ehit'){
      const u=document.getElementById('en'+ev.idx);if(!u)continue;const sp=u.querySelector('.sprwrap');const [x,y]=centerOf(sp||u);
      if(ev.dmg>0){restartClass(sp,'hit');burst(x,y,'#ff6a6a',6+Math.min(14,ev.dmg/2),60+Math.min(60,ev.dmg*2),6);}
      else if(ev.blk>0){restartClass(sp,'blocked');burst(x,y,'#8fb6ff',8,50,5);}
      if(ev.atk)slashFx(x,y,ev.dmg>=15,ev.dmg>=30);
      if(ev.dmg>=15)shake(Math.min(14,4+ev.dmg/4));
    }else if(ev.t==='phit'){
      const p=document.getElementById('player');if(!p)continue;const sp=p.querySelector('.sprwrap');const [x,y]=centerOf(sp||p);
      restartClass(sp,'phit');flash('rgba(255,30,40,.45)',ev.dmg>=15?520:360);shake(ev.dmg>=15?12:6);burst(x,y,'#ff5a5a',8,60,6);
    }else if(ev.t==='pparry'){
      const p=document.getElementById('player');if(!p)continue;const [x,y]=centerOf(p.querySelector('.sprwrap')||p);burst(x+20,y-10,'#fff3c4',10,50,4);popText(x+30,y-50,'叮！','#fff3c4',20);
    }else if(ev.t==='pblock'&&isA()){
      const rk=document.getElementById('rk');if(rk&&rk.animate){afterimages(document.getElementById('rbody'),120,40);rk.animate([{transform:'translate(0,0)'},{transform:'translate(-26px,0)',offset:.4},{transform:'translate(0,0)'}],{duration:320});}
      if(ghostOn()){const p=document.getElementById('player');const [x,y]=centerOf(p);ring(x,y,'#c9b8ff',60);}
    }else if(ev.t==='pbreak'&&isA()){
      const p=document.getElementById('player');if(!p)continue;const [x,y]=centerOf(p.querySelector('.sprwrap')||p);smokePuff(x,y+20,22);popText(x,y-60,'影幕破碎','#c9c0dd',22);
    }else if(ev.t==='pblock'){
      const p=document.getElementById('player');if(!p)continue;const sp=p.querySelector('.sprwrap');const [x,y]=centerOf(sp||p);
      restartClass(sp,'blocked');burst(x+30,y,'#9cc4ff',10,55,5);
    }else if(ev.t==='pbreak'){
      const p=document.getElementById('player');if(!p)continue;const [x,y]=centerOf(p.querySelector('.sprwrap')||p);
      burst(x+20,y,'#bcd7ff',22,110,8);popText(x,y-60,'破盾！','#9cc4ff',26);shake(8);
    }else if(ev.t==='pshield'){
      const p=document.getElementById('player');if(!p)continue;restartClass(p.querySelector('.sprwrap'),'shine');
    }else if(['pchan','pevoke','ppass','porbhit','porbs','pstatus','pbuffer'].includes(ev.t)){if(typeof PFX==='function'&&isPig())try{PFX(ev);}catch(e){}
    }else if(ev.t[0]==='c'&&ev.t.length>2&&typeof CFX==='function'){if(typeof isCoon==='function'&&isCoon())try{CFX(ev);}catch(e){console.error(e);}
    }else if(ev.t[0]==='n'&&ev.t.length>2&&typeof NFX==='function'){if(typeof isNb==='function'&&isNb())try{NFX(ev);}catch(e){console.error(e);}
    }else if(ev.t[0]==='a'&&typeof AFX==='function'){try{AFX(ev);}catch(e){}
    }else if(ev.t==='pbuff'){
      const p=document.getElementById('player');if(!p)continue;const [x,y]=centerOf(p);burst(x,y+20,ev.col||'#ffcf5a',8,40,5);
    }
  }
}


// ---- error reporter: show a small toast so bugs can be screenshotted ----
(function(){if(typeof window==='undefined'||!window.addEventListener)return;let last=0;
 function show(msg,stack){const now=Date.now();if(now-last<1500)return;last=now;try{let t=document.getElementById('errtoast');if(!t){t=document.createElement('div');t.id='errtoast';document.body.appendChild(t);}
  const line=(stack||'').split('\n').slice(1,3).map(s=>s.trim().replace(/\(.*index\.html:/,'(行 ')).join(' ← ');
  t.innerHTML=`<b>⚠️ 游戏出错了</b>（截图发给开发者）<br><code>${String(msg).replace(/</g,'&lt;')}</code><br><span>${line.replace(/</g,'&lt;')}</span><br><button onclick="this.parentNode.remove()">关闭</button> <button onclick="location.reload()">刷新页面</button>`;}catch(e){}}
 window.addEventListener('error',e=>show(e.message,e.error&&e.error.stack));
 window.addEventListener('unhandledrejection',e=>show(e.reason&&e.reason.message||e.reason,e.reason&&e.reason.stack));
})();

function mkCard(k,u=false){return {id:UID++,k,u:!!u};}
function cardCost(c){const d=CARDS[c.k];let v=(c.u&&d.cu!==undefined)?d.cu:d.c;if(C&&d.costf&&typeof v==='number'&&v>=0)v=d.costf(v,c);
  if(typeof v==='number'&&v>=0){if(c.plus)v+=c.plus;if(c.zero||c.mom)v=0;if(c.rp)v=Math.max(0,v-c.rp);if(C&&c.freeT===C.turn)v=0;if(C&&d.t==='pow'&&S('freepow'))v=0;}
  return v;}
function cardTip(c){
  const d=CARDS[c.k];const txt=strip(d.d(c.u,c));const out=[];
  if(d.t==='pow')out.push(['能力',KW['能力']]);
  for(const k in KW){if(k!=='能力'&&txt.includes(k))out.push([k,KW[k]]);}
  if(d.c==='X')out.push(['X','消耗你所有能量，效果重复 X 次。']);
  if(!c.u&&d.t!=='sts'&&!DCTX){const dc=d.cu!==undefined&&d.cu!==d.c;out.unshift(['升级后'+(dc?`（${d.cu} 费）`:''),strip(d.d(true))]);}
  if(!out.length)return '';
  return out.map(([k,v])=>`<div class="kw"><b>${k}</b><br>${v}</div>`).join('');
}

function isEth(c){if(!c)return false;const e=CARDS[c.k].eth;return !!((typeof e==='function'?e(c.u):e)||c.xeth);}
function isRet(c){if(!c)return false;const e=CARDS[c.k].ret;return !!((typeof e==='function'?e(c.u):e)||c.xret);}
function soulsExhausted(){return C?C.exhaust.filter(c=>c.k==='nSoul').length:0;}
function otherCatAtks(self){if(!C)return 0;return [...C.draw,...C.hand,...C.discard].filter(c=>c!==self&&CARDS[c.k].cat).length;}
function growScythe(c,v){if(!c)return;c.sc=(c.sc||0)+v;if(R&&R.deck){const o=R.deck.find(x=>x.id===c.id);if(o)o.sc=(o.sc||0)+v;}fxP('🗡️ 镰刀 +'+v,'#c9a8ff');}
function toHand(c,from){const i=from.indexOf(c);if(i<0)return;from.splice(i,1);if(C.hand.length>=10){C.discard.push(c);return;}C.hand.push(c);(C.newIds=C.newIds||[]).push(c.id);}
function nbPowers(){return Object.keys(CARDS).filter(k=>CARDS[k].ch==='nb'&&CARDS[k].t==='pow');}

function relSize(k,rot){const d=RELICS[k];const s=d.sz||SZ[d.r]||[1,1];return rot?[s[1],s[0]]:[s[0],s[1]];}
function relVal(k){const d=RELICS[k];return d.val||VAL[d.r]||5;}
function relicTip(k,extra=''){const d=RELICS[k];const [w,h]=relSize(k);return `<b>${d.e} ${d.n}</b> <span class="q-${d.r}">${d.big?'大红':RAR_N[d.r]}</span><br>${d.d}<div class="sub">占用 ${w}×${h} 格 · 价值 💎${relVal(k)}${d.energy?' · 能量遗物':''}</div>${extra}`;}

function potSlots(){if(!R)return 0;return R.potSlots||3;}
function ensurePots(){if(!R)return;if(!R.potions)R.potions=[];while(R.potions.length<potSlots())R.potions.push(null);}
function genPotion(){const ch=R&&R.ch||'knight';const rar=wpick([['c',65],['u',25],['r',10]]);const pool=Object.keys(POTIONS).filter(k=>POTIONS[k].r===rar&&(!POTIONS[k].ch||POTIONS[k].ch===ch));return pool.length?pick(pool):'fire';}
function potFree(){ensurePots();return R.potions.indexOf(null);}
function addPotion(k){ensurePots();const i=potFree();if(i<0)return false;R.potions[i]=k;return true;}
function potTip(k){const d=POTIONS[k];return `<b>${d.e} ${d.n}</b> <span class="q-${d.r}">${POT_RAR[d.r]}药水</span><br>${d.d}${d.tgt?'<div class="sub">需要选择目标</div>':''}`;}
function potionBarHTML(){ensurePots();return `<span class="potbar">${R.potions.map((k,i)=>k?`<span class="potslot q-${POTIONS[k].r}" onclick="potClick(${i})" data-tip="${esc(potTip(k)+'<div class=\"sub\">点击使用或丢弃</div>')}">${POTIONS[k].e}</span>`:`<span class="potslot empty" data-tip="空的药水栏位">·</span>`).join('')}</span>`;}

function potUsable(k){const d=POTIONS[k];if(d.passive)return false;if(C&&!C.over&&UI.screen==='combat')return !C.busy;return !!d.any;}
function potClick(i){ensurePots();const k=R.potions[i];if(!k)return;if(C&&C.selPot===i){C.selPot=null;render();return;}const d=POTIONS[k];hideTip();
  const ok=potUsable(k);
  openModal(`<h2>${d.e} ${d.n} <span class="q-${d.r}" style="font-size:14px">${POT_RAR[d.r]}药水</span></h2><p>${d.d}</p>${!ok&&!d.passive?'<p class="muted">只能在战斗中使用。</p>':''}
  <div class="row" style="gap:8px;justify-content:flex-end;margin-top:12px"><button class="danger small" onclick="potDiscard(${i})">丢弃</button><button class="small" onclick="closeModal()">取消</button>${ok?`<button class="primary" onclick="potUse(${i})">使用</button>`:''}</div>`);}
function potDiscard(i){R.potions[i]=null;closeModal();save();render();}
function potUse(i){const k=R.potions[i];if(!k||!potUsable(k))return;closeModal();const d=POTIONS[k];
  if(d.tgt&&C){const al=alive();if(al.length===1){potApply(i,al[0].idx);return;}C.sel=null;C.selPot=i;toast('选择药水的目标（点击敌人）');render();return;}
  potApply(i,null);}
function potApply(i,tidx){const k=R.potions[i];if(!k)return;const d=POTIONS[k];let t=null;
  if(d.tgt){t=C.enemies[tidx];if(!t||t.hp<=0)return;}
  R.potions[i]=null;if(C)C.selPot=null;
  try{potFx(k,t);}catch(e){}
  d.f(t);sfx('buff');
  if(C){logMsg('使用 '+d.n);fire('potionUsed',k);if(typeof checkEnd==='function'&&checkEnd())return;}
  save();render();}
function potFx(k,t){const d=POTIONS[k];const p=$i('player');if(!p)return;const [x1,y1]=centerOf(p.querySelector('.sprwrap')||p);
  if(t){const el=$i('en'+t.idx);const [x2,y2]=centerOf(el.querySelector('.sprwrap')||el);const b=fxEl('ghost',`left:${x1}px;top:${y1-30}px;width:30px;height:30px;font-size:26px;line-height:30px;text-align:center`, d.e);
    fxAnim(b,[{transform:'translate(-50%,-50%) rotate(0)'},{transform:`translate(calc(-50% + ${(x2-x1)/2}px),calc(-50% + ${(y2-y1)/2-120}px)) rotate(360deg)`,offset:.5},{transform:`translate(calc(-50% + ${x2-x1}px),calc(-50% + ${y2-y1+30}px)) rotate(720deg)`,opacity:.6}],{duration:420,easing:'ease-in-out'});
    setTimeout(()=>{burst(x2,y2,d.col,22,90,7);ring(x2,y2,d.col,70);},400);}
  else if(k==='explode'){alive().forEach(e=>{const [x,y]=centerOf($i('en'+e.idx));burst(x,y,d.col,24,110,8);ring(x,y,'#fff',80);});shake(8,300);}
  else{ring(x1,y1,d.col,90);burst(x1,y1,d.col,18,80,6);glowAt(x1,y1,d.col,500);}
  popText(x1,y1-90,d.e+' '+d.n,d.col,20);}
// fairy: auto revive
function tryFairy(){if(!R||R.hp>0)return false;ensurePots();const i=R.potions.indexOf('fairy');if(i<0)return false;R.potions[i]=null;R.hp=Math.max(1,Math.round(R.max*0.3));
  setTimeout(()=>{banner('瓶中精灵','#ffb3e6','精灵救了你一命！',1300,true);flash('rgba(255,180,230,.45)',700,false);},50);if(C)fxP('🧚 复活 '+R.hp,'#ffb3e6');return true;}

function rollPotionDrop(kind){if(kind==='elite'||kind==='boss')return genPotion();R.potCh=R.potCh==null?40:R.potCh;
  if(Math.random()*100<R.potCh){R.potCh=Math.max(10,R.potCh-10);return genPotion();}R.potCh=Math.min(90,R.potCh+10);return null;}

function genLayer(L,curTheme){
  const nodes=[];
  const mk=(depth,type)=>{const n={id:nodes.length,depth,ch:[],type:type||null,y:0};nodes.push(n);return n;};
  const root=mk(0,'start');
  const lens=[rnd(5,6),rnd(7,8),rnd(9,10)];
  const grades=['easy','normal','hard'];
  const themes=shuffle(Object.keys(THEMES).filter(t=>t!=='forest'&&t!==curTheme)).slice(0,3);
  const tier=Math.min(L,3);const keys=shuffle(BOSSES[tier].slice());
  const bosses=shuffle(lens.map((len,i)=>({len,grade:grades[i],theme:themes[i],boss:keys[i]})));
  bosses.forEach((b,i)=>b.slot=i);
  const ySlot=i=>(i-(bosses.length-1)/2)*DY;
  const avgY=list=>list.reduce((s,b)=>s+ySlot(b.slot),0)/list.length;
  function chain(ends,d1,d2,list,bt){
    let cur=ends;
    for(let d=d1;d<=d2;d++){
      const y=avgY(list);
      if(d<d2&&d>=2&&cur.length===1&&Math.random()<0.45){
        const a=mk(d),b=mk(d);a.y=y-44;b.y=y+44;
        [a,b].forEach(n=>{n.bt=bt;cur.forEach(p=>p.ch.push(n.id));});cur=[a,b];
      }else{const n=mk(d);n.y=y;n.bt=bt;cur.forEach(p=>p.ch.push(n.id));cur=[n];}
    }
    return cur;
  }
  function build(ends,list,depth){
    if(list.length===1){
      const b=list[0];const bt={theme:b.theme,s:depth,len:b.len};
      const e=chain(ends,depth+1,b.len-1,list,bt);
      const bn=mk(b.len,'boss');Object.assign(bn,{y:ySlot(b.slot),boss:b.boss,grade:b.grade,theme:b.theme,tier,bt});
      e.forEach(p=>p.ch.push(bn.id));
      return;
    }
    const minLen=Math.min(...list.map(b=>b.len));
    const sd=Math.max(depth,Math.min(minLen-3,depth+rnd(1,2)));
    const e=chain(ends,depth+1,sd,list,null);
    const k=list.length===2?1:rnd(1,list.length-1);
    build(e,list.slice(0,k),sd);build(e,list.slice(k),sd);
  }
  build([root],bosses,0);
  for(const n of nodes){
    if(n.type)continue;
    const preBoss=n.ch.some(id=>nodes[id].type==='boss');
    if(n.depth===1)n.type='fight';
    else if(preBoss)n.type=wpick([['rest',70],['shop',30]]);
    else if(n.depth===2)n.type=wpick([['fight',60],['event',40]]);
    else n.type=wpick([['fight',42],['event',20],['elite',14],['shop',8],['rest',8],['treasure',8]]);

async function doEnemyMove(e){

    if(e.hp<=0||R.hp<=0||C.over)break;
    switch(a){
      case 'atk':await enemyAttack(e,times||1,()=>{hurtPlayer(enemyDmg(e,sv(v)),e);if(e.st.thief)stealGold(e);if(S('thorns'))hitEnemy(e,S('thorns'));if(S('riposte')&&e.hp>0)hitEnemy(e,S('riposte'));});break;
      case 'block':await enemyFx(e,'block');e.block+=sv(v);fxE(e,'+'+sv(v)+'🛡','#7eb0ff');sfx('shield');render();break;
      case 'str':case 'ritual':case 'enrage':case 'plated':await enemyFx(e,'buff');addSt(e,a,v);sfx('buff');fxE(e,'⬆ '+(ST[a]?ST[a].n:''),'#f2c14e');render();break;
      case 'thorns':await enemyFx(e,'buff');e.st.thorns=v;render();break;
      case 'clearthorns':delete e.st.thorns;break;
      case 'heal':{await enemyFx(e,'heal');const h=Math.round(v*C.hpMul);e.hp=Math.min(e.max,e.hp+h);fxE(e,'+'+h,'#46c37b');sfx('heal');render();}break;
      case 'weak':case 'vuln':case 'poison':await enemyProjectile(e,a==='poison'?'spit':'orb');addSt(C,a,v);fxP(ST[a].i+ST[a].n,'#c58cff');sfx('debuff');render();break;
      case 'pstr':case 'pdex':await enemyProjectile(e,'orb');addSt(C,a==='pstr'?'str':'dex',v);fxP(a==='pstr'?'力量下降':'敏捷下降','#c58cff');sfx('debuff');render();break;
      case 'entangle':case 'constrict':await enemyProjectile(e,a==='entangle'?'spit':'orb');if(a==='constrict')C.st.constrict=Math.max(S('constrict'),v);else addSt(C,a,v);fxP(ST[a].i+ST[a].n,'#c58cff');sfx('debuff');render();break;
      case 'swallow':{const pool=C.draw.length?C.draw:C.discard;let n=0;for(let i=0;i<v;i++){const cs=pool.filter(c=>CARDS[c.k].t!=='sts'&&CARDS[c.k].t!=='cur');if(!cs.length)break;const c=pick(cs);pool.splice(pool.indexOf(c),1);(e.sw=e.sw||[]).push(c);n++;}

      case 'flee':e.fled=true;e.hp=0;e.dead=true;fxE(e,'🏃 带着金币逃跑了','#f2c14e');sfx('card');render();break;
      case 'fuse':await enemyFx(e,'buff');e.st.fuse=v;e.fuseNew=true;fxE(e,'💣 点燃引线','#ff9a3a');sfx('buff');render();break;
      case 'boom':delete e.st.fuse;shake(12,400);break;
      case 'cleanse':await enemyFx(e,'heal');if(e.st.poison)e.st.poison=Math.floor(e.st.poison/2);delete e.st.weak;delete e.st.vuln;fxE(e,'🧪 净化','#9be36b');sfx('heal');render();break;
      case 'slimed':await enemyCards(e,a,v);for(let i=0;i<v;i++)C.discard.push(mkCard(a));fxP('+'+v+'张'+CARDS[a].n,'#9be36b');render();break;
      case 'voidc':await enemyCards(e,a,v);for(let i=0;i<v;i++)C.draw.splice(rnd(0,C.draw.length),0,mkCard(a));fxP('+'+v+'张'+CARDS[a].n+'（抽牌堆）','#b0a0c0');render();break;
      case 'dazed':case 'burn':await enemyCards(e,a,v);for(let i=0;i<v;i++)C.discard.push(mkCard(a));fxP('+'+v+'张'+CARDS[a].n,'#bbb');render();break;

function AFX(ev){

  const E=ev.idx!=null?$i('en'+ev.idx):null;const [ex,ey]=E?centerOf(E.querySelector('.sprwrap')||E):[px+400,py];

    burst(px,py-40,'#b07cff',10,50,4);

      if(k==='aFlash'&&E){const ln=fxEl('spark',`left:${px}px;top:${ey}px;width:${ex-px+40}px;height:3px;background:linear-gradient(90deg,transparent,#fff,#b07cff);box-shadow:0 0 12px #b07cff`);fxAnim(ln,[{opacity:1},{opacity:0}],{duration:380});slashFx(ex,ey,true,true);}
      else if(k==='aSac'&&E){const b=blob(px,py-20,pcol(),20);flyFx(b,px,py-20,ex,ey,340,100,0);setTimeout(()=>burst(ex,ey,pcol(),18,70,7),340);}
      else if(k==='aVanish'){smokePuff(px,py+20,26,'#4a4458');ring(px,py,'#b07cff',90);}
      else if(k==='aReflex'){cardsToHand(ev.u?3:2,'#b07cff');}

      else if(E){const d=dagFx(px,py-30,'#b07cff',16,38);flyFx(d,px,py-30,ex,ey,300,90,720);setTimeout(()=>{impactStar(ex,ey,'#b07cff',8,70);},300);}
    },220);

  }else if(ev.t==='aafter'){const b=$i('rbody');if(b)afterimages(b,180,60);ring(px,py,'#9cc4ff',50);
  }else if(ev.t==='amark'&&E){const r=fxEl('fxring',`left:${ex}px;top:${ey}px;width:54px;height:54px;border-color:#ff3040;box-shadow:0 0 10px #ff3040`);fxAnim(r,[{transform:'translate(-50%,-50%) scale(1.6)',opacity:0},{transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.5},{transform:'translate(-50%,-50%) scale(.8)',opacity:0}],{duration:420});

// ================= v1.4 boss presentation =================
const BOSS_STYLE={slimeking:{t:'粘液君主',c:'#7bea5a'},guardian:{t:'远古机械卫士',c:'#4fd1ff'},hexa:{t:'六焰之魂',c:'#b28bff'},mimic:{t:'贪婪之匣',c:'#f2c14e'},
 fallen:{t:'堕落的圣骑统帅',c:'#ffd76a'},troll:{t:'山岭暴君',c:'#9bd06b'},timeeater:{t:'吞噬时间之物',c:'#6ff0ff'},plaguedoc:{t:'瘟疫之源',c:'#9be36b'},
 dragon:{t:'深渊炎龙',c:'#ff6b3a'},lich:{t:'不死君王',c:'#9cc4ff'},awakened:{t:'从沉睡中苏醒者',c:'#c9a8ff'},abysslord:{t:'万物终焉',c:'#b28bff'}};
function bossCol(k){return (BOSS_STYLE[k]||{}).c||'#ff5a6a';}
function bossAuraHTML(e){const c=bossCol(e.k);
  return `<div class="baura" style="--bc:${c}"><i class="bglow"></i><i class="brays"></i><i class="bring"></i>${[...Array(10)].map((_,i)=>`<b class="bember" style="left:${8+i*9}%;animation-delay:-${(i*0.47)%3}s;animation-duration:${2.4+(i%4)*0.5}s"></b>`).join('')}</div>`;}
function bossBarUpdate(){const f=$i('field');if(!f||!C)return;const b=C.enemies.find(e=>e.boss);let el=$i('bossbar');
  if(!b){if(el)el.remove();return;}
  if(!el){el=document.createElement('div');el.id='bossbar';f.appendChild(el);}
  const s=BOSS_STYLE[b.k]||{t:''};const c=bossCol(b.k);const pct=Math.max(0,b.hp/b.max*100);const n=curNode&&curNode();const g=n&&GRADES[n.grade];
  el.style.setProperty('--bc',c);el.classList.toggle('dead',b.hp<=0);el.classList.toggle('ph2',!!b.ph2);

function isCoon(){return !!(R&&R.ch==='coon');}
function bot(){if(!C)return {mods:[],slots:3};return C.bot||(C.bot={mods:[],slots:3});}
function scrap(){return C?(C.scrap||0):0;}
function modCount(){return C?bot().mods.length:0;}
function hasMod(k){return C?bot().mods.some(m=>m.k===k):false;}
function botStage(){const n=modCount();return n>=5?2:n>=3?1:0;}
function tuneV(){const st=botStage();return S('tune')+S('tuneT')+(st>=2?3:st>=1?1:0);}
function needOf(c){const d=CARDS[c.k];if(d.need==null)return 0;let n=typeof d.need==='function'?d.need(c.u):d.need;if(d.inst&&C&&C.freeInst)return 0;if(d.inst&&typeof has==='function'&&has('toolkit'))n=Math.max(0,n-1);return n;}
function needOK(c){return !C||needOf(c)<=scrap();}
function gainScrap(n){if(!C||n<=0)return;C.scrap=(C.scrap||0)+n;FXE.push({t:'cscrap',n});
  const ss=S('scrapstorm');if(ss)for(let i=0;i<n;i++){const e=rndAlive();if(!e)break;hitEnemy(e,ss);}}
function spendScrap(n){if(!C)return;C.scrap=Math.max(0,(C.scrap||0)-n);FXE.push({t:'cscrap',n:-n});}
function modVal(m){const t=tuneV();switch(m.k){case 'drill':return Math.max(0,(m.lv>1?12:8)+t);case 'shield':return Math.max(0,(m.lv>1?9:6)+t);case 'cannon':return Math.max(0,(m.lv>1?5:4)+t);case 'magnet':return m.lv>1?4:3;case 'battery':return 1;}return 0;}
function modShots(m){return m.k==='cannon'?(m.lv>1?3:2):1;}
function modAct(m,now){
  if(!C||C.over)return;const v=modVal(m);
  switch(m.k){
    case 'drill':{const e=alive()[0];if(e){FXE.push({t:'cbot',k:'drill',idx:e.idx});hitEnemy(e,v);}break;}
    case 'shield':FXE.push({t:'cbot',k:'shield'});gainBlock(v,true);break;
    case 'cannon':for(let i=0;i<modShots(m);i++){const e=rndAlive();if(!e)break;FXE.push({t:'cbot',k:'cannon',idx:e.idx,i});hitEnemy(e,v);}break;
    case 'magnet':FXE.push({t:'cbot',k:'magnet'});gainScrap(v);break;
    case 'battery':FXE.push({t:'cbot',k:'battery'});
      if(now){C.energy+=1;fxP('+1⚡','#6ff0ff');}
      else{C.batCh=(C.batCh||0)+1;if(m.lv>1||C.batCh%2===0){C.botE=(C.botE||0)+1;fxP('⚡ 充电完成','#6ff0ff');}}
      break;
  }
}
function botAct(now){
  if(!C||C.over)return;const b=bot();
  for(const m of b.mods.slice()){if(C.over)break;modAct(m,now);}
  if(botStage()>=2&&!C.over){const e=rndAlive();if(e){FXE.push({t:'cbot',k:'main',idx:e.idx});hitEnemy(e,10+tuneV());}}
  if(S('reinforce'))gainBlock(S('reinforce'),true);
  if(S('botscrap'))gainScrap(S('botscrap'));
  if(!b.mods.length&&botStage()<2)FXE.push({t:'cbot',k:'idle'});
}
function installMod(k,lv=1){
  if(!C)return;const b=bot();const ex=b.mods.find(m=>m.k===k);const st0=botStage();
  if(ex){if(ex.lv<2){ex.lv=2;FXE.push({t:'cinst',k,lv:2});fxP(MODS[k].e+' 升到 2 级','#ffd23f');}else{gainScrap(2);fxP(MODS[k].e+' 已满级','#bbb');}}
  else{
    if(b.slots<=0){gainScrap(2);return;}
    if(b.mods.length>=b.slots)removeMod(0);
    b.mods.push({k,lv:Math.min(2,lv)});FXE.push({t:'cinst',k,lv});fxP('+'+MODS[k].e+MODS[k].n,MODS[k].col);
    if(S('forge'))addSt(C,'tune',S('forge'));
  }
  const st=botStage();if(st!==st0)FXE.push({t:'cform',st,up:st>st0});
}
function removeMod(i,silent){
  const b=bot();const m=b.mods.splice(i,1)[0];if(!m)return null;const st0=st0f(b,m);
  if(!silent)gainScrap(2);FXE.push({t:'crem',k:m.k});

  const st=botStage();if(st!==st0)FXE.push({t:'cform',st,up:false});

}
function st0f(b,m){const n=b.mods.length+1;return n>=5?2:n>=3?1:0;}
function burstMod(m){
  if(!m||!C)return;const v=modVal(m);
  switch(m.k){
    case 'drill':{const e=alive()[0];if(e){FXE.push({t:'cbot',k:'drill',idx:e.idx});hitEnemy(e,v*4);}break;}
    case 'shield':gainBlock(v*3,true);FXE.push({t:'cbot',k:'shield'});break;
    case 'cannon':for(let i=0;i<modShots(m)*2;i++){const e=rndAlive();if(!e)break;FXE.push({t:'cbot',k:'cannon',idx:e.idx,i});hitEnemy(e,v);}break;
    case 'magnet':gainScrap(v*4);break;

}

function coonTurnEnd(){

  if(R.sent||!R.safe.items.length)return;

  openModal(`<h2>📦 寄送安全箱</h2><p>下面这些遗物会<b>立刻送回仓库</b>，之后就算阵亡也不会丢。但它们会离开这局游戏，<b>本局不再生效</b>，安全箱会腾空，可以装新的战利品。每局只能寄送一次。</p><div class="items">${ks.map(k=>relicRow(k)).join('')}</div><div class="row" style="margin-top:12px;justify-content:center"><button onclick="closeModal()">再想想</button><button class="primary" onclick="doSend()">确认寄送（${ks.length} 件 · 💎${ks.reduce((s,k)=>s+relVal(k),0)}）</button></div>`);

function doSend(){
  const ks=R.safe.items.map(it=>it.ref);
  M.stash.push(...ks.map(k=>({id:M.sid++,k})));
  R.relics=R.relics.filter(r=>!ks.includes(r.k));R.bag.items=R.bag.items.filter(it=>!ks.includes(it.ref));
  R.safe.items=[];R.sent=true;closeModal();sfx('extract');toast(`已寄送 ${ks.length} 件遗物回仓库`);save();toMap();
}
function startShop(){
  const cards=[];const used=new Set();let g=0;
  while(cards.length<5&&g++<100){const rar=wpick([['c',55],['u',35],['r',10]]);const pool=cardPool(rar).filter(k=>!used.has(k));if(!pool.length)continue;const k=pick(pool);used.add(k);cards.push({c:mkCard(k),p:{c:rnd(45,55),u:rnd(70,82),r:rnd(140,160)}[rar],sold:false});}
  const relics=[];const ru=new Set(R.relics.map(r=>r.k));
  for(const rar of ['c','u','r']){const pool=Object.keys(RELICS).filter(k=>RELICS[k].r===rar&&!ru.has(k)&&chOk(RELICS[k]));if(pool.length){const k=pick(pool);ru.add(k);relics.push({k,p:{c:rnd(140,160),u:rnd(200,230),r:rnd(270,300)}[rar],sold:false});}}
  const pots=[0,1,2].map(()=>{const k=genPotion();return {k,p:{c:rnd(45,55),u:rnd(70,80),r:rnd(95,110)}[POTIONS[k].r],sold:false};});
